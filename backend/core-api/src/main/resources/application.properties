spring.application.name=storyfork-core-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Independent leaf locations prevent Auth and attachment V1 collisions; Auth history is unchanged.
# sample/ holds development sample rows as ordinary migrations sharing the global version order.
spring.flyway.locations=classpath:db/migration/auth,classpath:db/migration/notification,classpath:db/migration/sample
# PostgreSQL DETAIL에는 이메일 등 데이터가 포함된다. SQLState와 오류 분류는 유지한다.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mail.host=${CORE_SMTP_HOST}
spring.mail.port=${CORE_SMTP_PORT}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.auth.public-origin=${AUTH_PUBLIC_ORIGIN}
app.auth.mail-from=${AUTH_MAIL_FROM}
# 로컬 개발 기본값. 운영 환경에서는 APP_CORS_ALLOWED_ORIGIN 환경변수로 덮어쓴다.
app.cors.allowed-origin=http://localhost:5173

# Core는 AI 상태만 조회한다. 콘텐츠 생성은 Content 런타임이 호출한다.
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:1s}
app.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:12s}

# 알림 사건 소비(RabbitMQ). 기본은 꺼져 있고 켜면 교환기·큐·DLQ를 선언하고 소비를 시작한다.
app.notification.events.enabled=${CORE_NOTIFICATION_EVENTS_ENABLED:false}
app.notification.events.exchange=storyfork.events
app.notification.events.queue=core.notification.events
spring.rabbitmq.host=${CORE_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${CORE_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${CORE_RABBITMQ_USER:}
spring.rabbitmq.password=${CORE_RABBITMQ_PASSWORD:}
# 실패는 3회(1s,2s) 재시도 후 거절하고, 거절한 메시지는 다시 큐에 넣지 않고 DLQ로 보낸다.
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
