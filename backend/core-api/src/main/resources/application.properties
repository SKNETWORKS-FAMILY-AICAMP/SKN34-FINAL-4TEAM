spring.application.name=storyfork-core-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${CORE_DATABASE_URL}
spring.datasource.username=${CORE_DATABASE_USER}
spring.datasource.password=${CORE_DATABASE_PASSWORD}
# Independent leaf locations prevent Auth and attachment V1 collisions; Auth history is unchanged.
spring.flyway.locations=classpath:db/migration/auth
# PostgreSQL DETAIL에는 이메일 등 데이터가 포함된다. SQLState와 오류 분류는 유지한다.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mail.host=${CORE_SMTP_HOST}
spring.mail.port=${CORE_SMTP_PORT}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.auth.public-origin=${AUTH_PUBLIC_ORIGIN}
app.auth.mail-from=${AUTH_MAIL_FROM}
# 로컬 개발 기본값. 운영 환경에서는 APP_CORS_ALLOWED_ORIGIN 환경변수로 덮어쓴다.
app.cors.allowed-origin=http://localhost:5173

# AI Service는 Core API만 호출하는 내부 서비스다. 운영 환경에서는 서버 환경변수로 덮어쓴다.
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:1s}
app.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:12s}

# Content is opt-in until a PostgreSQL database and server identity are configured.
app.content.enabled=${CONTENT_ENABLED:false}
app.content.dev-owner=${CONTENT_DEV_OWNER:}


# Private S3 attachments are opt-in; endpoint override is only for local MinIO.
app.setting-attachments.enabled=${SETTING_ATTACHMENTS_ENABLED:false}
app.setting-attachments.bucket=${ATTACHMENT_S3_BUCKET:}
app.setting-attachments.region=${ATTACHMENT_S3_REGION:${AWS_REGION:us-east-1}}
app.setting-attachments.endpoint=${ATTACHMENT_S3_ENDPOINT:}
# A little multipart envelope headroom; the service enforces 10 MiB per file.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
