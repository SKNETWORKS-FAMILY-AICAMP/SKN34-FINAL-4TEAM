plugins {
    id 'java'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.allopen' version '2.4.10'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = false
    }
}

group = 'ai.storyfork'
version = '0.0.1-SNAPSHOT'
description = 'STORYFORK Core API'

springBoot {
    mainClass = 'ai.storyfork.core.CoreApiApplicationKt'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.addAll(
            '-Xjsr305=strict',
            '-Xjspecify-annotations=strict'
        )
    }
}

repositories {
    mavenCentral()
}

allOpen {
    annotation('jakarta.persistence.Entity')
    annotation('jakarta.persistence.MappedSuperclass')
    annotation('jakarta.persistence.Embeddable')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation('software.amazon.awssdk:s3:2.57.8') {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client:2.57.8'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'tools.jackson.module:jackson-module-kotlin'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

// 실제 경계 기준: Spring context, HTTP transport, PostgreSQL/Flyway는 통합 계층이다.
// 새 경계 테스트는 이 목록에도 포함한다 (infrastructure/ci/test_ci.py가 누락을 검사).
def integrationTestClasses = [
    '**/*IntegrationTest.class', '**/*PostgresTest.class',
    '**/ContentMigrationTest.class', '**/CoreApiApplicationTest.class',
    '**/HealthControllerTest.class', '**/ContentAuthorizationTest.class',
    '**/AiServiceClientPropertiesTest.class', '**/AiServiceHealthClientTest.class',
    '**/AiServiceHealthControllerTest.class',
    '**/AttachmentConfigTest.class', '**/SettingAttachmentHttpTest.class',
    '**/AttachmentStorageClientTest.class', '**/AttachmentMigrationLocationTest.class'
]

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    filter { failOnNoMatchingTests = true }
}

tasks.register('unitTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    exclude integrationTestClasses
}

tasks.register('integrationTest', Test) {
    // Close evicted contexts and their pools before exhausting the isolated CI database.
    systemProperty 'spring.test.context.cache.maxSize', '4'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include integrationTestClasses
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
