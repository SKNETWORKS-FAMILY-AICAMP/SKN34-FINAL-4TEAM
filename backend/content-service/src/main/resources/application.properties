spring.application.name=storyfork-content-service
server.address=127.0.0.1
server.port=8081
# Each content-owned persistence configuration selects explicit entities, repositories and Flyway history.
app.worldstudio.neo4j.uri=${NEO4J_URI:bolt://127.0.0.1:7687}
app.worldstudio.neo4j.username=${NEO4J_USERNAME:neo4j}
app.worldstudio.neo4j.password=${NEO4J_PASSWORD:}
app.worldstudio.neo4j.database=${NEO4J_DATABASE:neo4j}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.core-auth.base-url=${CORE_AUTH_BASE_URL:http://127.0.0.1:8080}
app.core-auth.connect-timeout=${CORE_AUTH_CONNECT_TIMEOUT:1s}
app.core-auth.read-timeout=${CORE_AUTH_READ_TIMEOUT:3s}
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai-service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:1s}
app.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:12s}
app.setting-attachments.bucket=${ATTACHMENT_S3_BUCKET:storyfork-setting-attachments}
app.setting-attachments.region=${ATTACHMENT_S3_REGION:${AWS_REGION:us-east-1}}
app.setting-attachments.endpoint=${ATTACHMENT_S3_ENDPOINT:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
