plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.allopen' version '2.4.10'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.storyfork'
version = '0.0.1-SNAPSHOT'
description = 'STORYFORK Content Service'

springBoot {
    mainClass = 'ai.storyfork.content.ApplicationKt'
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.addAll('-Xjsr305=strict', '-Xjspecify-annotations=strict')
    }
}

allOpen {
    annotation('jakarta.persistence.Entity')
    annotation('jakarta.persistence.MappedSuperclass')
    annotation('jakarta.persistence.Embeddable')
}

repositories { mavenCentral() }

// MCP 창구(#163, DEC-49). Spring AI 2.0.x는 Spring Boot 4.1.x 기준으로 빌드됐다(2.1.x는 Boot 4.2 기준이라 쓰지 않는다).
dependencyManagement {
    imports { mavenBom 'org.springframework.ai:spring-ai-bom:2.0.2' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.neo4j.driver:neo4j-java-driver:6.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation('software.amazon.awssdk:s3:2.57.8') {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client:2.57.8'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'com.networknt:json-schema-validator:3.0.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

// Spring context, actual/mock HTTP transport and DB/Flyway run only in hosted CI.
def integrationTestClasses = [
    '**/*IntegrationTest.class', '**/*PostgresTest.class',
    '**/ContentMigrationTest.class', '**/ContentAuthorizationTest.class',
    '**/AttachmentConfigTest.class', '**/SettingAttachmentHttpTest.class',
    '**/AttachmentStorageClientTest.class', '**/AttachmentMigrationLocationTest.class'
]

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    filter { failOnNoMatchingTests = true }
}

tasks.register('unitTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    exclude integrationTestClasses
}

tasks.register('integrationTest', Test) {
    systemProperty 'spring.test.context.cache.maxSize', '4'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include integrationTestClasses
}
