spring.application.name=storyfork-operations-service
# No human login: keep Boot from generating (and logging) a default user and password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.address=127.0.0.1
server.port=8082
# Service-to-service credential only; an empty value never permits protected access.
app.operations.service-token=${OPERATIONS_SERVICE_TOKEN:}
# Core verifies member Bearers and owns members; Content owns works. The service token above is sent to both.
app.operations.core-base-url=${OPERATIONS_CORE_BASE_URL:http://127.0.0.1:8080}
app.operations.content-base-url=${OPERATIONS_CONTENT_BASE_URL:http://127.0.0.1:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/storyfork}
spring.datasource.username=${DATABASE_USER:storyfork}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=operations
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/operations
spring.flyway.schemas=operations
spring.flyway.default-schema=operations
spring.flyway.table=operations_flyway_schema_history
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
