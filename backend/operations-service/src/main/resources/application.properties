spring.application.name=storyfork-operations-service
server.address=127.0.0.1
server.port=8082
# Service-to-service credential only; an empty value never permits protected access.
app.operations.service-token=${OPERATIONS_SERVICE_TOKEN:}
spring.datasource.url=${OPERATIONS_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/storyfork}
spring.datasource.username=${OPERATIONS_DATABASE_USER:storyfork}
spring.datasource.password=${OPERATIONS_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=operations
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/operations
spring.flyway.schemas=operations
spring.flyway.default-schema=operations
spring.flyway.table=operations_flyway_schema_history
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
