spring.application.name=storyfork-operations-service
# No human login: keep Boot from generating (and logging) a default user and password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.address=127.0.0.1
server.port=8082
# Service-to-service credential only; an empty value never permits protected access.
app.operations.service-token=${OPERATIONS_SERVICE_TOKEN:}
# Core verifies member Bearers and owns members; Content owns works. The service token above is sent to both.
app.operations.core-base-url=${OPERATIONS_CORE_BASE_URL:http://127.0.0.1:8080}
app.operations.content-base-url=${OPERATIONS_CONTENT_BASE_URL:http://127.0.0.1:8081}
# Langfuse is the LLMOps source of truth: the same project keys as the AI service, read through its Public API. Admins never open the Langfuse web.
app.operations.langfuse-base-url=${OPERATIONS_LANGFUSE_BASE_URL:http://127.0.0.1:3000}
app.operations.langfuse-public-key=${LANGFUSE_PUBLIC_KEY:}
app.operations.langfuse-secret-key=${LANGFUSE_SECRET_KEY:}
# The AI service runs regression evaluations and the leak judge; INTERNAL_TOKEN is the one Core, Content and AI already share.
app.operations.ai-base-url=${OPERATIONS_AI_BASE_URL:http://127.0.0.1:8000}
app.operations.internal-token=${INTERNAL_TOKEN:}
# Alert notifications go to the same RabbitMQ as Core's notification events; the short connect timeout keeps a broker outage from stalling a scheduled check.
spring.rabbitmq.host=${OPERATIONS_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${OPERATIONS_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${OPERATIONS_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${OPERATIONS_RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=5s
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/storyfork}
spring.datasource.username=${DATABASE_USER:storyfork}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=operations
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/operations
spring.flyway.schemas=operations
spring.flyway.default-schema=operations
spring.flyway.table=operations_flyway_schema_history
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
