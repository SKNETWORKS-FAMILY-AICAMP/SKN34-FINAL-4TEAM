# Production-server image selection; combine with docker-compose.yaml.
# main images must be published separately: the current CD workflow publishes develop only.
# External DB/SMTP, HTTPS ingress and operational approval are prerequisites, not provisioned here.
name: storyfork-production

services:
  # Variable names match local/dev; the production server's own .env supplies values. Blank required values fail config.
  ai-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-ai-service:main
    platform: linux/amd64
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}

  # ai-service와 같은 이미지에서 전처리 Celery worker를 띄운다. 브로커는 CELERY_BROKER_URL 또는 외부 CORE_RABBITMQ_*로 정한다.
  ai-worker:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-ai-service:main
    platform: linux/amd64
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}

  core-api:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-core-api:main
    platform: linux/amd64
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the external PostgreSQL JDBC URL}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      CORE_SMTP_HOST: ${CORE_SMTP_HOST:?Set CORE_SMTP_HOST to the external SMTP host}
      CORE_SMTP_PORT: ${CORE_SMTP_PORT:?Set CORE_SMTP_PORT}
      SPRING_MAIL_USERNAME: ${CORE_SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${CORE_SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${CORE_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?Set AUTH_PUBLIC_ORIGIN to the public HTTPS origin}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?Set AUTH_MAIL_FROM}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_COOKIE_SECURE: "true"
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:?Set CONTENT_CORE_AUTH_TOKEN}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:?Set OPERATIONS_SERVICE_TOKEN}
      APP_CORS_ALLOWED_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?Set AUTH_PUBLIC_ORIGIN to the public HTTPS origin}

  content-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-content-service:main
    platform: linux/amd64
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the external PostgreSQL JDBC URL}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:?Set CONTENT_CORE_AUTH_TOKEN}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:?Set OPERATIONS_SERVICE_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}
      APP_CORS_ALLOWED_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?Set AUTH_PUBLIC_ORIGIN to the public HTTPS origin}

  operations-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-operations-service:main
    platform: linux/amd64
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the external PostgreSQL JDBC URL}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:?Set OPERATIONS_SERVICE_TOKEN}

  web:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-web:main
    platform: linux/amd64
    ports:
      - "127.0.0.1:${WEB_PORT:?Provision a free production loopback port}:80"
