# Production-server image selection; combine with docker-compose.yaml.
# main images must be published separately: the current CD workflow publishes develop only.
# External DB/SMTP, HTTPS ingress and operational approval are prerequisites, not provisioned here.
name: storyfork-production

services:
  ai-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-ai-service:main
    platform: linux/amd64
    environment:
      OPENAI_API_KEY: ${PROD_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${PROD_OPENAI_MODEL:-}
      INTERNAL_TOKEN: ${PROD_INTERNAL_TOKEN:?Set PROD_INTERNAL_TOKEN}

  core-api:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-core-api:main
    platform: linux/amd64
    environment:
      CORE_DATABASE_URL: ${PROD_DATABASE_URL:?Set PROD_DATABASE_URL to the external PostgreSQL JDBC URL}
      CORE_DATABASE_USER: ${PROD_DATABASE_USER:?Set PROD_DATABASE_USER}
      CORE_DATABASE_PASSWORD: ${PROD_DATABASE_PASSWORD:?Set PROD_DATABASE_PASSWORD}
      CORE_SMTP_HOST: ${PROD_SMTP_HOST:?Set PROD_SMTP_HOST to the external SMTP host}
      CORE_SMTP_PORT: ${PROD_SMTP_PORT:?Set PROD_SMTP_PORT}
      SPRING_MAIL_USERNAME: ${PROD_SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${PROD_SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${PROD_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      AUTH_PUBLIC_ORIGIN: ${PROD_PUBLIC_ORIGIN:?Set PROD_PUBLIC_ORIGIN to the public HTTPS origin}
      AUTH_MAIL_FROM: ${PROD_MAIL_FROM:?Set PROD_MAIL_FROM}
      AUTH_JWT_SECRET: ${PROD_AUTH_JWT_SECRET:?Set PROD_AUTH_JWT_SECRET}
      AUTH_COOKIE_SECURE: "true"
      CONTENT_CORE_AUTH_TOKEN: ${PROD_CONTENT_CORE_AUTH_TOKEN:?Set PROD_CONTENT_CORE_AUTH_TOKEN}
      # Optional: blank fails closed (operations calls are rejected).
      OPERATIONS_SERVICE_TOKEN: ${PROD_OPERATIONS_SERVICE_TOKEN:-}
      APP_CORS_ALLOWED_ORIGIN: ${PROD_PUBLIC_ORIGIN:?Set PROD_PUBLIC_ORIGIN to the public HTTPS origin}

  content-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-content-service:main
    platform: linux/amd64
    environment:
      CONTENT_ENABLED: ${PROD_CONTENT_ENABLED:-false}
      APP_WORLDSTUDIO_ENABLED: ${PROD_WORLDSTUDIO_ENABLED:-false}
      CONTENT_DATABASE_URL: ${PROD_DATABASE_URL:?Set PROD_DATABASE_URL to the external PostgreSQL JDBC URL}
      CONTENT_DATABASE_USER: ${PROD_DATABASE_USER:?Set PROD_DATABASE_USER}
      CONTENT_DATABASE_PASSWORD: ${PROD_DATABASE_PASSWORD:?Set PROD_DATABASE_PASSWORD}
      CONTENT_CORE_AUTH_TOKEN: ${PROD_CONTENT_CORE_AUTH_TOKEN:?Set PROD_CONTENT_CORE_AUTH_TOKEN}
      INTERNAL_TOKEN: ${PROD_INTERNAL_TOKEN:?Set PROD_INTERNAL_TOKEN}
      OPERATIONS_SERVICE_TOKEN: ${PROD_OPERATIONS_SERVICE_TOKEN:-}
      APP_CORS_ALLOWED_ORIGIN: ${PROD_PUBLIC_ORIGIN:?Set PROD_PUBLIC_ORIGIN to the public HTTPS origin}

  operations-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-operations-service:main
    platform: linux/amd64
    environment:
      OPERATIONS_DATABASE_URL: ${PROD_DATABASE_URL:?Set PROD_DATABASE_URL to the external PostgreSQL JDBC URL}
      OPERATIONS_DATABASE_USER: ${PROD_DATABASE_USER:?Set PROD_DATABASE_USER}
      OPERATIONS_DATABASE_PASSWORD: ${PROD_DATABASE_PASSWORD:?Set PROD_DATABASE_PASSWORD}
      OPERATIONS_SERVICE_TOKEN: ${PROD_OPERATIONS_SERVICE_TOKEN:-}

  web:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-web:main
    platform: linux/amd64
    ports:
      - "127.0.0.1:${PROD_WEB_PORT:?Provision a free production loopback port}:80"
