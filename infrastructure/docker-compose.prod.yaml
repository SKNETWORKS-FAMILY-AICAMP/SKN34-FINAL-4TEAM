# Source-built runtime-image validation stack; NOT an Internet-ready deployment.
name: storyfork-prod-validation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storyfork
      POSTGRES_USER: ${CORE_DATABASE_USER:?Set CORE_DATABASE_USER}
      POSTGRES_PASSWORD: ${CORE_DATABASE_PASSWORD:?Set CORE_DATABASE_PASSWORD}
    volumes:
      - core-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${CORE_MAILPIT_WEB_PORT:-8025}:8025"

  # 알림 사건 검증용 브로커. 기본 스택에는 포함하지 않으며 `--profile events`로만 켠다.
  # 관리 UI·포트는 열지 않고 상태 확인은 컨테이너 안의 rabbitmqctl로 한다.
  rabbitmq:
    image: rabbitmq:4.1.0-alpine
    profiles: [events]
    hostname: storyfork-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${CORE_RABBITMQ_USER:-storyfork}
      RABBITMQ_DEFAULT_PASS: ${CORE_RABBITMQ_PASSWORD:-}
    volumes:
      - core-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile

  core-api:
    build:
      context: ../backend/core-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      CORE_SMTP_HOST: mailpit
      CORE_SMTP_PORT: 1025
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${WEB_PORT:-8088}}

  content-service:
    build:
      context: ../backend/content-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    environment:
      CONTENT_DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${WEB_PORT:-8088}}

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"

volumes:
  core-postgres:
  core-rabbitmq:
