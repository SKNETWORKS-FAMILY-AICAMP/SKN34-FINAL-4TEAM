name: storyfork-elasticsearch

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - manuscript-index:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  manuscript-index:
