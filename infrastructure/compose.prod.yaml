# Standalone deploy-image validation stack, NOT an Internet-ready deployment.
name: storyfork-prod-validation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storyfork
      POSTGRES_USER: ${CORE_DATABASE_USER:?Set CORE_DATABASE_USER}
      POSTGRES_PASSWORD: ${CORE_DATABASE_PASSWORD:?Set CORE_DATABASE_PASSWORD}
    volumes:
      - core-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${CORE_MAILPIT_WEB_PORT:-8025}:8025"

  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    expose:
      - "8000"

  core-api:
    build:
      context: ../backend/core-api
      dockerfile: Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      CORE_DATABASE_USER: ${CORE_DATABASE_USER:?Set CORE_DATABASE_USER}
      CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:?Set CORE_DATABASE_PASSWORD}
      CORE_SMTP_HOST: mailpit
      CORE_SMTP_PORT: 1025
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?Set AUTH_PUBLIC_ORIGIN}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?Set AUTH_MAIL_FROM}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${WEB_PORT:-8088}}
    expose:
      - "8080"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    init: true
    depends_on:
      - core-api
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"

volumes:
  core-postgres:
