# GitHub CI 전용: base + local 소스 빌드 뒤에 병합한다. 배포 DB·volume은 사용하지 않는다.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_DB: storyfork_test
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d storyfork_test"]

  mailpit:
    ports: !override ["127.0.0.1::8025"]

  neo4j:
    ports: !reset []

  minio:
    ports: !reset []

  ai-service:
    environment:
      # 누락 제공사 설정의 명시적 503을 검증한다. 실제 키/유료 호출/대역 서버는 불필요하다.
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""

  core-api:
    ports: !reset []
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork_test
      AUTH_COOKIE_SECURE: "false"
      APP_CORS_ALLOWED_ORIGIN: http://127.0.0.1:8088

  content-service:
    ports: !reset []
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork_test
      APP_CORS_ALLOWED_ORIGIN: http://127.0.0.1:8088

  operations-service:
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork_test

  web:
    ports: !override ["127.0.0.1::80"]
