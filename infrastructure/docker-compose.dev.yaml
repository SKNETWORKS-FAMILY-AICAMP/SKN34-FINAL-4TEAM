# Develop-server deployment: published apps + project-local PostgreSQL/Mailpit, NOT HMR.
# External/shared DB cutover is NOT performed by this configuration change.
name: storyfork-develop-cd

x-cd-labels: &cd-labels
  io.storyfork.cd.repository: SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-4TEAM
  io.storyfork.cd.directory: ${CD_DIRECTORY:?Provision a dedicated deployment directory}

services:
  postgres:
    extends:
      file: ${CD_LOCAL_COMPOSE_FILE:-docker-compose.local.yaml}
      service: postgres
    labels: *cd-labels
    ports: !reset []

  mailpit:
    extends:
      file: ${CD_LOCAL_COMPOSE_FILE:-docker-compose.local.yaml}
      service: mailpit
    labels: *cd-labels
    ports: !reset []

  neo4j:
    extends:
      file: ${CD_LOCAL_COMPOSE_FILE:-docker-compose.local.yaml}
      service: neo4j
    labels: *cd-labels
    ports: !reset []

  rabbitmq:
    extends:
      file: ${CD_LOCAL_COMPOSE_FILE:-docker-compose.local.yaml}
      service: rabbitmq
    labels: *cd-labels

  # local과 같은 소스(infrastructure/minio)로 버전당 한 번 빌드해 게시한 이미지.
  minio:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-minio:RELEASE.2025-10-15T17-29-55Z
    platform: linux/amd64
    labels: *cd-labels
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    command: [server, /data, --console-address, ':9001']
    volumes:
      - setting-attachments:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-ai-service:develop
    platform: linux/amd64
    labels: *cd-labels
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}

  core-api:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-core-api:develop
    platform: linux/amd64
    labels: *cd-labels
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:?Set CONTENT_CORE_AUTH_TOKEN}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:?Set OPERATIONS_SERVICE_TOKEN}
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      CORE_SMTP_HOST: mailpit
      CORE_RABBITMQ_HOST: rabbitmq
      CORE_SMTP_PORT: 1025
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?Set AUTH_PUBLIC_ORIGIN}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?Set AUTH_MAIL_FROM}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${CD_WEB_PORT:?Provision a free loopback port}}

  content-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-content-service:develop
    platform: linux/amd64
    labels: *cd-labels
    depends_on:
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:?Set CONTENT_CORE_AUTH_TOKEN}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:?Set OPERATIONS_SERVICE_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN}
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-storyfork-setting-attachments}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-us-east-1}
      ATTACHMENT_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      NEO4J_URI: bolt://neo4j:7687
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${CD_WEB_PORT:?Provision a free loopback port}}

  operations-service:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-operations-service:develop
    platform: linux/amd64
    labels: *cd-labels
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:?Set OPERATIONS_SERVICE_TOKEN}
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}

  web:
    image: ghcr.io/sknetworks-family-aicamp/storyfork-web:develop
    platform: linux/amd64
    labels: *cd-labels
    ports:
      - "127.0.0.1:${CD_WEB_PORT:?Provision a free loopback port}:80"

volumes:
  core-postgres:
    labels: *cd-labels
  worldstudio-neo4j:
    labels: *cd-labels
  core-rabbitmq:
    labels: *cd-labels
  setting-attachments:
    labels: *cd-labels

networks:
  default:
    labels:
      io.storyfork.cd.repository: SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-4TEAM
      io.storyfork.cd.directory: ${CD_DIRECTORY:?Provision a dedicated deployment directory}
