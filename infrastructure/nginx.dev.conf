map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    # Match the production proxy: generation may wait up to 75 seconds in Content.
    proxy_read_timeout 90s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /api/v1/world-studios {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/world-studios/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/works/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/public/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/works/ {
        proxy_pass http://content-service:8081;
    }
    # SSE: 알림 변경 신호. 버퍼링을 끄고 긴 연결을 허용한다(서버가 20초마다 ping을 보내 유휴 종료를 막는다).
    location = /api/v1/me/notifications/stream {
        proxy_pass http://core-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }
    location = /api {
        proxy_pass http://core-api:8080;
    }
    location ^~ /api/ {
        proxy_pass http://core-api:8080;
    }
    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
