# Optional content storage overlay. Reuse the base Auth PostgreSQL service and volume.
# Authentication supplies the verified JWT Principal; no demo identity in containers.
services:
  core-api:
    environment:
      CONTENT_ENABLED: "true"
      CONTENT_DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      CONTENT_DATABASE_USER: ${CORE_DATABASE_USER:?Set CORE_DATABASE_USER}
      CONTENT_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:?Set CORE_DATABASE_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set an internal service token}
  ai-service:
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set an internal service token}
