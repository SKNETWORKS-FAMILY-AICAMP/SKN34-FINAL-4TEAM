# Shared application settings; use with docker-compose.local.yaml, .dev.yaml or .prod.yaml.
# This base has no image/build selection and is not runnable on its own.
services:
  ai-service:
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    expose:
      - "8000"

  core-api:
    init: true
    environment:
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:-}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      # 알림 사건 소비는 기본 꺼짐. 켜면 CORE_RABBITMQ_* 로 브로커에 연결한다.
      CORE_NOTIFICATION_EVENTS_ENABLED: ${CORE_NOTIFICATION_EVENTS_ENABLED:-false}
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
    expose:
      - "8080"
    # Bash is in the existing JRE image; no new probe dependency or authenticated route.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r protocol status rest <&3 && test \"$$status\" = 200"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  content-service:
    init: true
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      CONTENT_ENABLED: ${CONTENT_ENABLED:-false}
      APP_WORLDSTUDIO_ENABLED: ${APP_WORLDSTUDIO_ENABLED:-false}
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:-}
      CORE_AUTH_BASE_URL: http://core-api:8080
      CORE_AUTH_CONNECT_TIMEOUT: ${CORE_AUTH_CONNECT_TIMEOUT:-1s}
      CORE_AUTH_READ_TIMEOUT: ${CORE_AUTH_READ_TIMEOUT:-3s}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      AI_GENERATION_READ_TIMEOUT: ${AI_GENERATION_READ_TIMEOUT:-75s}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    expose:
      - "8081"

  web:
    init: true
    depends_on:
      - core-api
      - content-service
