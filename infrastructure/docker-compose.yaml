# Shared application settings; use with docker-compose.prod.yaml or docker-compose.dev.yaml.
# This base has no image/build selection and is not runnable on its own.
services:
  ai-service:
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    expose:
      - "8000"

  core-api:
    init: true
    environment:
      CORE_DATABASE_USER: ${CORE_DATABASE_USER:?Set CORE_DATABASE_USER}
      CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:?Set CORE_DATABASE_PASSWORD}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?Set AUTH_PUBLIC_ORIGIN}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?Set AUTH_MAIL_FROM}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      AI_GENERATION_READ_TIMEOUT: ${AI_GENERATION_READ_TIMEOUT:-75s}
      CONTENT_ENABLED: ${CONTENT_ENABLED:-false}
      CONTENT_DATABASE_USER: ${CORE_DATABASE_USER:?Set CORE_DATABASE_USER}
      CONTENT_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:?Set CORE_DATABASE_PASSWORD}
      # Content generation requires a real shared token; no demo fallback.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    expose:
      - "8080"

  web:
    init: true
    depends_on:
      - core-api
