# Shared application settings; use with docker-compose.local.yaml, .dev.yaml or .prod.yaml.
# This base has no image/build selection and is not runnable on its own.
services:
  ai-service:
    init: true
    environment: &ai-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-storyfork}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
      # 운영 회귀 평가(ai-jobs-worker)의 채점 모델. 비우면 OPENAI_MODEL이다(계약 operations-llmops-contract).
      EVALUATION_JUDGE_MODEL: ${EVALUATION_JUDGE_MODEL:-}
      # 회귀 평가 통과 허용 오차(지표별 기준 평균 - 이 값 이상이면 통과, 점수는 모두 0~1). 비우면 0.1이다.
      EVAL_TOLERANCE: ${EVAL_TOLERANCE:-0.1}
      # 프롬프트 자동 개선(GEPA, #823)의 반성 모델 경로: 로컬 OpenCodex 게이트웨이로만 부른다(생성·채점은 OPENAI_API_KEY 그대로). 비면 기본 OpenAI·OPENAI_API_KEY·gpt-6-sol이다.
      PROMPT_OPTIMIZER_BASE_URL: ${PROMPT_OPTIMIZER_BASE_URL:-}
      PROMPT_OPTIMIZER_API_KEY: ${PROMPT_OPTIMIZER_API_KEY:-}
      PROMPT_OPTIMIZER_MODEL: ${PROMPT_OPTIMIZER_MODEL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # 집필 AI Retrieval 도구가 부르는 Content 내부 검색 API. Content는 32자 이상 INTERNAL_TOKEN만 받는다.
      CONTENT_SERVICE_BASE_URL: http://content-service:8081
      # 작업 워커(ai-jobs-worker)가 운영 정기 작업의 실행을 맡길 운영 내부 API. 내부 토큰은 위 INTERNAL_TOKEN이다(운영이 AI를 부를 때와 같은 값).
      OPERATIONS_SERVICE_BASE_URL: http://operations-service:8082
      # 집필 AI 대화·HITL 체크포인트(LangGraph AsyncPostgresSaver). 비우면 대화 요청은 503이다.
      AI_CHECKPOINT_DATABASE_URL: ${AI_CHECKPOINT_DATABASE_URL:-}
      # Langfuse 추적(질문·원고 인용·답변 포함). 키가 비면 추적하지 않는다.
      # 주소는 컨테이너 내부 이름으로 고정한다(루트 .env의 localhost 값은 네이티브 실행용이고, 키가 있는데 주소가 비면 SDK가 클라우드로 보낸다).
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      # 회차 원고 전처리 Celery 큐(RabbitMQ). Core와 같은 rabbitmq 컨테이너·자격(CORE_RABBITMQ_*)을 쓰며 비밀번호가 URL에 들어간다(영문·숫자 권장).
      AI_CELERY_BROKER_URL: amqp://${CORE_RABBITMQ_USER:-storyfork}:${CORE_RABBITMQ_PASSWORD:-}@${CORE_RABBITMQ_HOST:-rabbitmq}:${CORE_RABBITMQ_PORT:-5672}//
    # 호스트에서 별도 도구를 실행하는 기존 설정에서도 내부 호스트 이름을 유지한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  # 회차 원고 전처리 Celery 워커. ai-service와 같은 이미지·환경을 쓰며 동시 작업 수는 AI_PREPROCESSING_CONCURRENCY가 정한다.
  ai-worker:
    init: true
    command: [celery, -A, app.preprocessing.worker, worker, -Q, preprocessing, "--concurrency=${AI_PREPROCESSING_CONCURRENCY:-3}", --loglevel=INFO]
    environment: *ai-environment

  # 작업 Celery 워커(회귀 평가·운영 정기 작업, 계약 operations-funnel-credit-contract §4). ai-service와 같은 이미지·환경으로 jobs 큐의 작업을
  # AI_JOBS_CONCURRENCY(기본 4)개까지 동시에 실행한다. 원고 전처리 워커(ai-worker)와 큐·동시성이 따로다.
  ai-jobs-worker:
    init: true
    command: [celery, -A, app.jobs.worker, worker, -Q, jobs, "--concurrency=${AI_JOBS_CONCURRENCY:-4}", --loglevel=INFO]
    environment: *ai-environment
    # 프롬프트 자동 개선(#823)의 반성 모델을 호스트의 로컬 게이트웨이(PROMPT_OPTIMIZER_BASE_URL의 host.docker.internal)로 부르는 워커다. Linux는 이 이름이 자동으로 풀리지 않는다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 평가 세트(app/evaluation/datasets/*.jsonl)를 Langfuse Dataset으로 등록하는 1회성 작업. 같은 AI 이미지로 `up`마다 한 번 돌고 끝난다(멱등 upsert).
  # Langfuse가 막 뜨는 중이면 실패하므로 10초 간격으로 30번까지 다시 시도하고, 그래도 안 되면 실패로 끝나 로그에 남는다.
  ai-eval-seed:
    init: true
    restart: "no"
    command: [sh, -c, "for i in $$(seq 30); do python -m app.evaluation.seed && exit 0; sleep 10; done; exit 1"]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: http://langfuse-web:3000

  image-worker:
    init: true
    command: [celery, -A, app.images.worker:app, worker, --concurrency=1, --loglevel=WARNING]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 이미지 추적은 모델·규격·사용량·실패 유형만 기록한다.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CONTENT_SERVICE_BASE_URL: http://content-service:8081
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-storyfork}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-storyfork-setting-attachments}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-us-east-1}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      content-service:
        condition: service_started

  core-api:
    init: true
    environment:
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:-}
      # Operations → Core/Content 내부 API 자격. 비어 있으면 운영 호출을 거절한다.
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:-}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      # 알림 사건 브로커. local·dev는 rabbitmq 컨테이너로 고정한다.
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-storyfork}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
      # 가입 체험 크레딧 지급량. 팀 결정 전이라 기본 0(지급하지 않음)이며 값을 주면 켜진다.
      CREDIT_SIGNUP_TRIAL_AMOUNT: ${CREDIT_SIGNUP_TRIAL_AMOUNT:-0}
    expose:
      - "8080"
    # Bash is in the existing JRE image; no new probe dependency or authenticated route.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r protocol status rest <&3 && test \"$$status\" = 200"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  content-service:
    init: true
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # 관계 정본. local·dev는 neo4j 컨테이너로 고정한다.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:-}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:-}
      CORE_AUTH_BASE_URL: http://core-api:8080
      CORE_AUTH_CONNECT_TIMEOUT: ${CORE_AUTH_CONNECT_TIMEOUT:-1s}
      CORE_AUTH_READ_TIMEOUT: ${CORE_AUTH_READ_TIMEOUT:-3s}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      AI_GENERATION_READ_TIMEOUT: ${AI_GENERATION_READ_TIMEOUT:-75s}
      # AI 자율 연재(#659)의 크레딧 예약 상한. 시뮬레이션 제안 글은 작성자, 선택지 생성·회차 요약·회차 실행은 작품 소유자가 부담한다.
      SERIAL_SIMULATION_CREDIT_LIMIT: ${SERIAL_SIMULATION_CREDIT_LIMIT:-5}
      SERIAL_CHOICE_CREDIT_LIMIT: ${SERIAL_CHOICE_CREDIT_LIMIT:-5}
      SERIAL_SUMMARY_CREDIT_LIMIT: ${SERIAL_SUMMARY_CREDIT_LIMIT:-5}
      SERIAL_EPISODE_CREDIT_LIMIT: ${SERIAL_EPISODE_CREDIT_LIMIT:-1000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # 원고 기반 최초 세계관 구축(app.manuscript-build.enabled, Spring 완화 바인딩 이름). 실모델 4화 실측 뒤 시연용으로 켠다.
      APP_MANUSCRIPTBUILD_ENABLED: ${APP_MANUSCRIPTBUILD_ENABLED:-true}
      # 알림 사건 발행(outbox → storyfork.events). Core와 같은 rabbitmq 컨테이너·자격을 쓴다.
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-storyfork}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
    expose:
      - "8081"

  # 신고·회원·관리자 운영 API. 호스트 포트 없이 컨테이너 네트워크(nginx)에서만 노출한다.
  operations-service:
    init: true
    depends_on:
      core-api:
        condition: service_healthy
      content-service:
        condition: service_started
    environment:
      SERVER_ADDRESS: 0.0.0.0
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:-}
      OPERATIONS_CORE_BASE_URL: http://core-api:8080
      OPERATIONS_CONTENT_BASE_URL: http://content-service:8081
      # 대시보드·LLMOps 중계(DEC-55). Langfuse는 컨테이너 내부 주소로, AI와 같은 프로젝트 API 키로만 부른다(화면 링크 없음).
      OPERATIONS_LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 프롬프트 버전에 고를 수 있는 모델(#806, 쉼표 구분, AI 서비스가 OpenAI로 부르는 모델만). 빈 값은 Spring이 기본값 대신 빈 목록으로 읽어 기본 목록을 여기 둔다.
      LLMOPS_MODELS: ${LLMOPS_MODELS:-gpt-6-luna,gpt-6.1-terra,gpt-6-sol,gpt-6.1-sol,gpt-6-astra}
      # 평가 위임·누설 판정은 AI 내부 API로 부르며 Content와 같은 INTERNAL_TOKEN을 쓴다.
      OPERATIONS_AI_BASE_URL: http://ai-service:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # 경고 알림 사건은 Core와 같은 rabbitmq·자격으로 발행한다(루트 .env의 OPERATIONS_RABBITMQ_*는 네이티브 실행용).
      OPERATIONS_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      OPERATIONS_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      OPERATIONS_RABBITMQ_USERNAME: ${CORE_RABBITMQ_USER:-storyfork}
      OPERATIONS_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
    expose:
      - "8082"

  web:
    init: true
    depends_on:
      - core-api
      - content-service
      - operations-service
