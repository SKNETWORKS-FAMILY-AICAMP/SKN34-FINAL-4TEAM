# Shared application settings; use with docker-compose.local.yaml, .dev.yaml or .prod.yaml.
# This base has no image/build selection and is not runnable on its own.
services:
  ai-service:
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # 집필 AI Retrieval 도구가 부르는 Content 내부 검색 API. Content는 32자 이상 INTERNAL_TOKEN만 받는다.
      CONTENT_SERVICE_BASE_URL: http://content-service:8081
      # 집필 AI 대화·HITL 체크포인트(LangGraph AsyncPostgresSaver). 비우면 대화 요청은 503이다.
      AI_CHECKPOINT_DATABASE_URL: ${AI_CHECKPOINT_DATABASE_URL:-}
      # 집필 AI Langfuse 추적(질문·원고 인용·답변 포함). 키가 비면 추적하지 않는다.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    # 호스트에서 별도 도구를 실행하는 기존 설정에서도 내부 호스트 이름을 유지한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  core-api:
    init: true
    environment:
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:-}
      # Operations → Core/Content 내부 API 자격. 비어 있으면 운영 호출을 거절한다.
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:-}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      # 알림 사건 브로커. local·dev는 rabbitmq 컨테이너로 고정한다.
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-storyfork}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
      # 가입 체험 크레딧 지급량. 팀 결정 전이라 기본 0(지급하지 않음)이며 값을 주면 켜진다.
      CREDIT_SIGNUP_TRIAL_AMOUNT: ${CREDIT_SIGNUP_TRIAL_AMOUNT:-0}
    expose:
      - "8080"
    # Bash is in the existing JRE image; no new probe dependency or authenticated route.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r protocol status rest <&3 && test \"$$status\" = 200"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  content-service:
    init: true
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # 관계 정본. local·dev는 neo4j 컨테이너로 고정한다.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      CONTENT_CORE_AUTH_TOKEN: ${CONTENT_CORE_AUTH_TOKEN:-}
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:-}
      CORE_AUTH_BASE_URL: http://core-api:8080
      CORE_AUTH_CONNECT_TIMEOUT: ${CORE_AUTH_CONNECT_TIMEOUT:-1s}
      CORE_AUTH_READ_TIMEOUT: ${CORE_AUTH_READ_TIMEOUT:-3s}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      AI_GENERATION_READ_TIMEOUT: ${AI_GENERATION_READ_TIMEOUT:-75s}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # 알림 사건 발행(outbox → storyfork.events). Core와 같은 rabbitmq 컨테이너·자격을 쓴다.
      CORE_RABBITMQ_HOST: ${CORE_RABBITMQ_HOST:-rabbitmq}
      CORE_RABBITMQ_PORT: ${CORE_RABBITMQ_PORT:-5672}
      CORE_RABBITMQ_USER: ${CORE_RABBITMQ_USER:-storyfork}
      CORE_RABBITMQ_PASSWORD: ${CORE_RABBITMQ_PASSWORD:-}
    expose:
      - "8081"

  # 신고·회원·관리자 운영 API. 호스트 포트 없이 컨테이너 네트워크(nginx)에서만 노출한다.
  operations-service:
    init: true
    depends_on:
      core-api:
        condition: service_healthy
      content-service:
        condition: service_started
    environment:
      SERVER_ADDRESS: 0.0.0.0
      OPERATIONS_SERVICE_TOKEN: ${OPERATIONS_SERVICE_TOKEN:-}
      OPERATIONS_CORE_BASE_URL: http://core-api:8080
      OPERATIONS_CONTENT_BASE_URL: http://content-service:8081
    expose:
      - "8082"

  web:
    init: true
    depends_on:
      - core-api
      - content-service
      - operations-service
