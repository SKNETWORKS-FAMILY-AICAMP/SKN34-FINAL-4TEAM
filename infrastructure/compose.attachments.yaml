# Optional LOCAL MinIO overlay: combine with docker-compose.yaml and docker-compose.local.yaml.
# Production uses AWS S3, not this service. Create the private bucket before uploading.
services:
  content-service:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SETTING_ATTACHMENTS_ENABLED: "true"
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-storyfork-setting-attachments}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-us-east-1}
      ATTACHMENT_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set local MinIO credentials}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set local MinIO credentials}
  minio:
    build:
      context: ./minio
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set local MinIO credentials}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set local MinIO credentials}
    command: [server, /data, --console-address, ':9001']
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - setting-attachments:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  setting-attachments:
