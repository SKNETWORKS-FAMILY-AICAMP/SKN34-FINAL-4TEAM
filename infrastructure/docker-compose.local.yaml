# Local source-built stack, also reused by CI; nginx runtime, NOT HMR.
# A new project-scoped volume deliberately does not reuse storyfork-dev or deployment data.
name: storyfork-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storyfork
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - core-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  # WorldStudio 관계 정본. local·개발 배포 모두 항상 띄운다.
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - worldstudio-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${CORE_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CORE_MAILPIT_WEB_PORT:-8025}:8025"

  # 알림 사건 브로커. local·개발 배포 모두 항상 띄운다. 관리 UI·포트는 열지 않는다.
  rabbitmq:
    image: rabbitmq:4.1.0-alpine
    hostname: storyfork-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${CORE_RABBITMQ_USER:-storyfork}
      RABBITMQ_DEFAULT_PASS: ${CORE_RABBITMQ_PASSWORD:?Set CORE_RABBITMQ_PASSWORD}
    volumes:
      - core-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile

  core-api:
    build:
      context: ../backend/core-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      CORE_SMTP_HOST: mailpit
      CORE_RABBITMQ_HOST: rabbitmq
      CORE_SMTP_PORT: 1025
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://127.0.0.1:${WEB_PORT:-5173}}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?Set AUTH_MAIL_FROM}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${WEB_PORT:-5173}}
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8080}:8080"

  content-service:
    build:
      context: ../backend/content-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${WEB_PORT:-5173}}
    ports:
      - "127.0.0.1:${CONTENT_SERVICE_PORT:-8081}:8081"

  operations-service:
    build:
      context: ../backend/operations-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/storyfork
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${OPERATIONS_SERVICE_PORT:-8082}:8082"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"

volumes:
  core-postgres:
  worldstudio-neo4j:
  core-rabbitmq:
