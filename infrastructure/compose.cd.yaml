# Image-only, isolated loopback validation deployment; not Internet-ready.
name: storyfork-develop-cd

x-cd-labels: &cd-labels
  io.storyfork.cd.repository: SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-4TEAM
  io.storyfork.cd.directory: ${CD_DIRECTORY:?Provision a dedicated deployment directory}
  io.storyfork.cd.sha: ${CD_SOURCE_SHA:?Use the verified full develop SHA}

services:
  ai-service:
    image: ${CD_AI_SERVICE_IMAGE:?Use the verified AI image digest}
    platform: linux/amd64
    init: true
    labels: *cd-labels
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    expose:
      - "8000"

  core-api:
    image: ${CD_CORE_API_IMAGE:?Use the verified Core image digest}
    platform: linux/amd64
    init: true
    labels: *cd-labels
    environment:
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-1s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-12s}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:${CD_WEB_PORT:?Provision a free loopback port}}
    expose:
      - "8080"

  web:
    image: ${CD_WEB_IMAGE:?Use the verified web image digest}
    platform: linux/amd64
    init: true
    labels: *cd-labels
    depends_on:
      - core-api
    ports:
      - "127.0.0.1:${CD_WEB_PORT:?Provision a free loopback port}:80"

networks:
  default:
    labels:
      io.storyfork.cd.repository: SKNETWORKS-FAMILY-AICAMP/SKN34-FINAL-4TEAM
      io.storyfork.cd.directory: ${CD_DIRECTORY:?Provision a dedicated deployment directory}
