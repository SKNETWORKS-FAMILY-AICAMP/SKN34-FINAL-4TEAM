# Langfuse self-host(#302, 로컬·dev·prod 편입 DEC-55). 루트 compose.yaml과 dev·prod Compose 파일이 각자의 include로 앱 스택과 같은 프로젝트에서 켠다(정의 복제 없음).
# 공식 docker-compose.yml(langfuse/langfuse)에서 웹·worker와 앱 스택에 없는 저장소(ClickHouse·Redis)만 남겼다(AI gateway 제외).
# PostgreSQL·MinIO는 앱 스택의 postgres(langfuse DB, 첫 시작 때 Langfuse 마이그레이션이 만든다)와 minio(첨부 버킷의 langfuse/ 접두어)를 쓴다(2026-11-23 사용자 결정).
# 외부 PostgreSQL·S3를 쓰는 prod는 LANGFUSE_DATABASE_URL·LANGFUSE_S3_ENDPOINT를 서버 .env에 둔다.
# 웹 화면은 쓰지 않는다(2026-11-23 사용자 결정). langfuse-web은 AI·운영이 내부 주소로 부르는 API 서버라 남기되 호스트 포트·로그인 사용자가 없다.
name: storyfork-langfuse

x-langfuse-env: &langfuse-env
  # 웹 화면을 열지 않지만 Langfuse 웹 서버가 시작할 때 필요한 값이다.
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql://${DATABASE_USER:?Set DATABASE_USER}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@postgres:5432/langfuse}
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY (openssl rand -hex 32)}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # 앱 첨부 버킷을 같이 쓰고 접두어로 나눈다(첨부 키는 langfuse/로 시작하지 않는다).
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${ATTACHMENT_S3_BUCKET:-storyfork-setting-attachments}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${ATTACHMENT_S3_REGION:-us-east-1}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://minio:9000}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: langfuse/events/
  # 집필 AI는 미디어를 올리지 않는다.
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${ATTACHMENT_S3_BUCKET:-storyfork-setting-attachments}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${ATTACHMENT_S3_REGION:-us-east-1}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://minio:9000}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: langfuse/media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD}

# 앱 postgres·minio는 다른 파일의 서비스라 여기서 기다리지 않는다(prod에는 없다). 아직 안 떴으면 재시작으로 다시 붙는다.
x-langfuse-depends-on: &langfuse-depends-on
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy

# 컨테이너 로그가 디스크를 채우지 않게 모든 서비스에 같은 크기 제한을 둔다(ClickHouse 로그가 디스크를 71GB까지 채운 적이 있다).
x-langfuse-logging: &langfuse-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.78.0
    restart: unless-stopped
    logging: *langfuse-logging
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET}
      # 첫 시작 때 조직·프로젝트와 AI·운영 서비스가 쓸 API 키를 만든다. 이미 있으면 건너뛴다. 키는 두 서비스의 LANGFUSE_PUBLIC_KEY·LANGFUSE_SECRET_KEY와 같은 변수다.
      LANGFUSE_INIT_ORG_ID: storyfork
      LANGFUSE_INIT_ORG_NAME: STORYFORK
      LANGFUSE_INIT_PROJECT_ID: storyfork-writing-ai
      LANGFUSE_INIT_PROJECT_NAME: writing-ai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY (pk-lf-...)}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY (sk-lf-...)}
      # 로그인 사용자는 만들지 않는다.
      AUTH_DISABLE_SIGNUP: "true"

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.78.0
    restart: unless-stopped
    logging: *langfuse-logging
    depends_on: *langfuse-depends-on
    environment: *langfuse-env

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    logging: *langfuse-logging
    user: "101:101"
    mem_limit: 3g
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  langfuse-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *langfuse-logging
    command: --requirepass ${LANGFUSE_REDIS_PASSWORD} --maxmemory-policy noeviction
    volumes:
      - langfuse-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD}

volumes:
  langfuse-clickhouse:
  langfuse-clickhouse-logs:
  langfuse-redis:
