<svg xmlns="http://www.w3.org/2000/svg" width="820" height="454" viewBox="0 0 820 454" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="820" height="454" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold">결과 ② 필터가 미래 정보를 걸러 낸다</text>
<text x="30" y="66" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">인물에게 준 문맥(상위 6개)에 기준 회차 뒤 정보가 섞인 질문의 비율 (낮을수록 좋음)</text>
<text x="30" y="104" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">한국어 KoTimeChara</text>
<text x="218" y="135" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">벡터만</text>
<rect x="230" y="120" width="375.0" height="22" rx="4" fill="#9ca3af"/>
<text x="613.0" y="136" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">75%</text>
<text x="218" y="169" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">0+1</text>
<rect x="230" y="154" width="315.0" height="22" rx="4" fill="#16a34a"/>
<text x="553.0" y="170" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">63%</text>
<text x="218" y="203" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">0+1+2 (필터 전)</text>
<rect x="230" y="188" width="100.0" height="22" rx="4" fill="#7c3aed"/>
<text x="338.0" y="204" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">20%</text>
<text x="218" y="237" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">0+1+2+3 (필터 후)</text>
<rect x="230" y="222" width="10.0" height="22" rx="4" fill="#dc2626"/>
<text x="248.0" y="238" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">2%</text>
<text x="30" y="266" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">영어 TimeChara</text>
<text x="218" y="297" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">벡터만</text>
<rect x="230" y="282" width="380.0" height="22" rx="4" fill="#9ca3af"/>
<text x="618.0" y="298" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">76%</text>
<text x="218" y="331" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">0+1</text>
<rect x="230" y="316" width="320.0" height="22" rx="4" fill="#16a34a"/>
<text x="558.0" y="332" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">64%</text>
<text x="218" y="365" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">0+1+2 (필터 전)</text>
<rect x="230" y="350" width="195.0" height="22" rx="4" fill="#7c3aed"/>
<text x="433.0" y="366" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">39%</text>
<text x="218" y="399" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal">0+1+2+3 (필터 후)</text>
