<text x="240" y="400" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">0%</text>
<text x="30" y="440" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">필터 후 0~2%는 규칙이 지켜진다는 확인이다. 필터와 따로 만든 정답표로 세면 한국어는 4%가 남는다(벡터만 77%).</text>
</svg>
