<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="390" viewBox="0 0 1060 390" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="1060" height="390" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#1f2937" text-anchor="start" font-weight="bold">NovelBrain: 네 단계를 차례로 쌓는다</text>
<text x="30" y="66" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">질문 하나 → 세 가지 방법으로 찾고 → 합치고 → 그 인물이 알 수 있는 것만 남긴다</text>
<rect x="30" y="170" width="120" height="70" rx="10" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5"/>
<text x="90" y="200" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">질문</text>
<text x="90" y="222" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">+ 인물 · 기준 회차</text>
<rect x="200" y="100" width="290" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="214" y="124" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">0  세계관 그래프 (PPR)</text>
<text x="214" y="145" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">인물·장소 카드에서 관계를 따라 퍼진다</text>
<text x="214" y="161" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">맡는 것: 작가가 만든 정본의 사실</text>
<line x1="150" y1="205" x2="198" y2="134" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="490" y1="134" x2="538" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="200" y="185" width="290" height="68" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="214" y="209" font-size="15" fill="#16a34a" text-anchor="start" font-weight="bold">1  원고 벡터 검색</text>
<text x="214" y="230" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">뜻이 비슷한 원고 문단을 찾는다</text>
<text x="214" y="246" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">맡는 것: 그래프에 없는 장면·대사·감정</text>
<line x1="150" y1="205" x2="198" y2="219" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="490" y1="219" x2="538" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="200" y="270" width="290" height="68" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="214" y="294" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="bold">2  BM25 낱말 검색</text>
<text x="214" y="315" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">같은 낱말이 들어간 카드를 찾는다</text>
<text x="214" y="331" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">맡는 것: 고유명사·지명·설정 용어</text>
<line x1="150" y1="205" x2="198" y2="304" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="490" y1="304" x2="538" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="540" y="165" width="120" height="80" rx="10" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5"/>
<text x="600" y="198" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">RRF 합산</text>
<text x="600" y="220" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">세 순위를 하나로</text>
<line x1="660" y1="205" x2="698" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="700" y="150" width="170" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="785" y="180" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">3  시점·인물 필터</text>
<text x="785" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">기준 회차 뒤 정보 ✘</text>
<text x="785" y="224" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">다른 인물의 기억·비밀 ✘</text>
<text x="785" y="244" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">확인 못 한 것은 빼고 기록</text>
<line x1="870" y1="205" x2="908" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="910" y="170" width="120" height="70" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="970" y="200" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">인물에게 줄</text>
<text x="970" y="220" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">문맥 (상위 6~8개)</text>
<text x="30" y="370" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">모델·DB를 부르지 않는 순수 함수(backend/ai-service/app/novelbrain). 카드·관계는 Content MCP, 원고 발췌는 기존 검색에서 받아 넘긴다.</text>
</svg>
