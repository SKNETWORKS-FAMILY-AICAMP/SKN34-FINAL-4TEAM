# 기존 QA Compose 위에만 적용한다. 팀 DB/포트와 분리된 실제 Core·Content 런타임.
services:
  core:
    image: gradle:9.5.1-jdk21
    volumes: [qa-work:/tmp/initial-build-qa]
    command: [java, -Xmx512m, -jar, /tmp/initial-build-qa/backend/core-api/build/libs/storyfork-core-api-0.0.1-SNAPSHOT.jar, --server.address=0.0.0.0, --server.port=8080, --app.cors.allowed-origin=http://127.0.0.1:5187]
    ports: ['127.0.0.1:18080:8080']
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/qa_core
      DATABASE_USER: qa_only
      DATABASE_PASSWORD: qa-only-disposable
      AUTH_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_COOKIE_SECURE: 'false'
      AUTH_PUBLIC_ORIGIN: http://localhost:5187
      AUTH_MAIL_FROM: qa@example.test
      CORE_SMTP_HOST: localhost
      CORE_SMTP_PORT: 2525
      CONTENT_CORE_AUTH_TOKEN: qa-browser-content-core-token-0123456789
  content:
    image: gradle:9.5.1-jdk21
    volumes: [qa-work:/tmp/initial-build-qa]
    command: [java, -Xmx768m, -jar, /tmp/initial-build-qa/backend/content-service/build/libs/storyfork-content-service-0.0.1-SNAPSHOT.jar, --server.address=0.0.0.0, --server.port=8081, --app.manuscript-build.enabled=true, --app.cors.allowed-origin=http://127.0.0.1:5187]
    ports: ['127.0.0.1:18081:8081']
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/worldstudio_test
      DATABASE_USER: qa_only
      DATABASE_PASSWORD: qa-only-disposable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: qa-only-disposable
      CORE_AUTH_BASE_URL: http://core:8080
      CONTENT_CORE_AUTH_TOKEN: qa-browser-content-core-token-0123456789
      AI_SERVICE_BASE_URL: http://host.docker.internal:8769
      INTERNAL_TOKEN: qa-token
