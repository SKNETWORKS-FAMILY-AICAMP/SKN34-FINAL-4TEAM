name: storyfork-initial-build-qa-20261117
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qa_only
      POSTGRES_PASSWORD: qa-only-disposable
      POSTGRES_DB: worldstudio_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U qa_only -d worldstudio_test"]
      interval: 2s
      retries: 30
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/qa-only-disposable
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    tmpfs: [/data, /logs]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -u neo4j -p qa-only-disposable 'RETURN 1' >/dev/null"]
      interval: 5s
      retries: 30
  tests:
    image: gradle:9.5.1-jdk21
    working_dir: /workspace/backend/content-service
    environment:
      TEST_WORLDSTUDIO_DATABASE_URL: jdbc:postgresql://postgres:5432/worldstudio_test
      TEST_WORLDSTUDIO_DATABASE_USER: qa_only
      TEST_WORLDSTUDIO_DATABASE_PASSWORD: qa-only-disposable
      TEST_WORLDSTUDIO_DISPOSABLE: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: qa-only-disposable
    volumes:
      - ../../..:/workspace
      - qa-gradle:/home/gradle/.gradle
      - qa-work:/tmp/initial-build-qa
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    command: [sh, /workspace/docs/verification/two-path-qa/run.sh, integrationTest, --tests, ai.storyfork.content.world.InitialWorldAnalysisPostgresTest, --tests, ai.storyfork.content.world.PublicWorldHttpIntegrationTest, --tests, ai.storyfork.content.world.InitialBuildHttpIntegrationTest, --tests, ai.storyfork.content.world.ManuscriptBuildStoragePostgresTest, --tests, ai.storyfork.content.world.InitialWorldStoragePostgresTest]
volumes:
  qa-gradle:
  qa-work:
