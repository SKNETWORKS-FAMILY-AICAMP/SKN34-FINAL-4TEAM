server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep the proxy open beyond the default 75s generation deadline.
    proxy_read_timeout 90s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    # No URI suffix: preserve paths, query strings, status, Bearer and CSRF headers.
    location = /api/v1/world-studios {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/world-studios/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/works/ {
        # 원고 가져오기: EPUB 50MB + 요청 JSON을 한 요청으로 받는다(Content max-request-size=51MB와 맞춤).
        client_max_body_size 51m;
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/public/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/works/ {
        proxy_pass http://content-service:8081;
    }
    # Operations public API: reports·members·admins·support·works and the notice·event admin/public paths only; the service-token notices/events/inquiries stay unexposed.
    location = /api/v1/operations/reports {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/reports/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/members {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/members/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admins {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admins/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/support {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/support/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/works {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/works/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admin/notices {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admin/notices/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/public/notices {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/public/notices/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admin/events {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admin/events/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/public/events {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/public/events/ {
        proxy_pass http://operations-service:8082;
    }
    # Auth, CSRF issuance and health remain Core-owned; internal endpoints have no proxy.
    # SSE: 알림 변경 신호. 버퍼링을 끄고 긴 연결을 허용한다(서버가 20초마다 ping을 보내 유휴 종료를 막는다).
    location = /api/v1/me/notifications/stream {
        proxy_pass http://core-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }
    location = /api {
        proxy_pass http://core-api:8080;
    }
    location ^~ /api/ {
        proxy_pass http://core-api:8080;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
