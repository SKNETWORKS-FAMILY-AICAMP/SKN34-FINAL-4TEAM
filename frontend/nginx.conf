server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep the proxy open beyond the default 75s generation deadline.
    proxy_read_timeout 90s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    # No URI suffix: preserve paths, query strings, status, Bearer and CSRF headers.
    location = /api/v1/world-studios {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/world-studios/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/works/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/public/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/works/ {
        proxy_pass http://content-service:8081;
    }
    # Auth, CSRF issuance and health remain Core-owned; internal endpoints have no proxy.
    location = /api {
        proxy_pass http://core-api:8080;
    }
    location ^~ /api/ {
        proxy_pass http://core-api:8080;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
