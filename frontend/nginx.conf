server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep the proxy open beyond the default 75s generation deadline.
    proxy_read_timeout 90s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    # No URI suffix: preserve paths, query strings, status, Bearer and CSRF headers.
    location = /api/v1/world-studios {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/world-studios/ {
        proxy_pass http://content-service:8081;
        # 설정 카드 첨부(#735)는 파일당 10 MiB(multipart 11 MiB)까지라 그보다 작으면 nginx가 먼저 413으로 끊는다.
        client_max_body_size 11m;
    }
    location = /api/v1/public/world-studios {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/world-studios/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/works {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/me/storage-usage {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/works/ {
        # 원고 가져오기: EPUB 50MB + 요청 JSON을 한 요청으로 받는다(Content max-request-size=51MB와 맞춤).
        client_max_body_size 51m;
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/public/works {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/works/ {
        proxy_pass http://content-service:8081;
    }
    location = /api/v1/public/genres {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/genres/ {
        proxy_pass http://content-service:8081;
    }
    # 운영자 콘텐츠 관리: 공개 카드 카테고리 목록(숨김 포함, active 플래그)은 Content로 보낸다.
    location = /api/v1/public/card-categories {
        proxy_pass http://content-service:8081;
    }
    location ^~ /api/v1/public/card-categories/ {
        proxy_pass http://content-service:8081;
    }
    # Operations public API: reports·members·admins·support·works·comments·genres·credits·world-studios·card-categories·admin/activities and the notice·event admin/public paths only; the service-token notices/events/inquiries stay unexposed.
    location = /api/v1/operations/reports {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/reports/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/members {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/members/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admins {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admins/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/support {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/support/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/works {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/works/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/comments {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/comments/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admin/notices {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admin/notices/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/public/notices {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/public/notices/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admin/events {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admin/events/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/public/events {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/public/events/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/admin/activities {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/admin/activities/ {
        proxy_pass http://operations-service:8082;
    }
    # DEC-55 운영 대시보드·LLMOps·경고·작업 감시: 네 접두와 하위 경로(trace·prompt·평가·일정 등)를 Operations로 보낸다. Langfuse 웹은 개발자용 포트로만 열어 여기에 두지 않는다.
    location = /api/v1/operations/dashboard {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/dashboard/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/llmops {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/llmops/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/alerts {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/alerts/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/jobs {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/jobs/ {
        proxy_pass http://operations-service:8082;
    }
    # DEC-56 장르 관리: 목록·추가와 하위 경로({code} 수정·order 순서)를 Operations로 보낸다.
    location = /api/v1/operations/genres {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/genres/ {
        proxy_pass http://operations-service:8082;
    }
    # DEC-57 크레딧 운영: 회원별 잔액·내역과 수동 지급·회수(/credits/members/{id}[/grants|/revocations])를 Operations로 보낸다.
    location = /api/v1/operations/credits {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/credits/ {
        proxy_pass http://operations-service:8082;
    }
    # 운영자 콘텐츠 관리: 공개 세계관 목록·제한/해제와 카드 카테고리 관리({code} 수정·order 순서)를 Operations로 보낸다.
    location = /api/v1/operations/world-studios {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/world-studios/ {
        proxy_pass http://operations-service:8082;
    }
    location = /api/v1/operations/card-categories {
        proxy_pass http://operations-service:8082;
    }
    location ^~ /api/v1/operations/card-categories/ {
        proxy_pass http://operations-service:8082;
    }
    # Auth, CSRF issuance and health remain Core-owned; internal endpoints have no proxy.
    # SSE: 알림 변경 신호. 버퍼링을 끄고 긴 연결을 허용한다(서버가 20초마다 ping을 보내 유휴 종료를 막는다).
    location = /api/v1/me/notifications/stream {
        proxy_pass http://core-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }
    location = /api {
        proxy_pass http://core-api:8080;
    }
    location ^~ /api/ {
        proxy_pass http://core-api:8080;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        # 해시 없는 index.html은 매번 재검증해야 재배포 뒤 옛 번들을 쓰지 않는다.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
