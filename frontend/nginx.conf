server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep the proxy open beyond the default 75s generation deadline.
    proxy_read_timeout 90s;

    # No URI suffix: preserve /api and upstream status, including API 404s.
    location = /api {
        proxy_pass http://core-api:8080;
    }
    location ^~ /api/ {
        proxy_pass http://core-api:8080;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
