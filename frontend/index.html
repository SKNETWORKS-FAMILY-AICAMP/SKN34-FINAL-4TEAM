<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STORYFORK · 인터랙티브 HTML MVP</title>
<style>
/* =========================================================
   STORYFORK 인터랙티브 MVP — 단일 파일 / 오프라인 / 외부 리소스 없음
   [G] 디자인 가이드 v3 토큰·치수 그대로  ·  [P] 기획서 v10 기능
   ========================================================= */
:root{--ui:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--story:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;--mono:"JetBrains Mono","D2Coding",Consolas,Menlo,monospace;--ease:cubic-bezier(.16,1,.3,1);
--bg:#F8F9FA;--surface:#FFFFFF;--muted-bg:#F1F3F5;--read-bg:#FBF8F1;--ink:#191A1F;--ink2:#3A3D45;--sub:#5F6370;--faint:#8E94A0;--line:#E9ECEF;--line2:#DEE2E6;
--pri:#6D4AE0;--pri-d:#5836C9;--pri-soft:#EFEAFF;--pri-ink:#4B2DB8;--on-pri:#FFFFFF;--acc:#F5B014;--acc-soft:#FFF4D6;--acc-ink:#8A5A00;--on-acc:#2B1D00;--sk1:#ECEEF1;--sk2:#F6F7F9;--fixed-dark:#1E1B2E;
--sh:0 1px 2px rgba(20,20,30,.05),0 8px 24px rgba(20,20,30,.06);--sh-up:0 6px 14px rgba(20,20,30,.10),0 22px 44px rgba(20,20,30,.14);color-scheme:light}
:root[data-theme="dark"]{--bg:#121214;--surface:#1C1C21;--muted-bg:#26262C;--read-bg:#17171A;--ink:#ECECF1;--ink2:#C9CAD3;--sub:#A0A3AE;--faint:#737885;--line:#2C2C33;--line2:#3A3A43;
--pri:#9D87FF;--pri-d:#B3A2FF;--pri-soft:#2A2340;--pri-ink:#C7BAFF;--on-pri:#140E2B;--acc:#F7BE3A;--acc-soft:#3A2E12;--acc-ink:#F7C95C;--on-acc:#241800;--sk1:#24242A;--sk2:#2E2E35;--fixed-dark:#26223A;
--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--sh-up:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--surface:#1C1C21;--muted-bg:#26262C;--read-bg:#17171A;--ink:#ECECF1;--ink2:#C9CAD3;--sub:#A0A3AE;--faint:#737885;--line:#2C2C33;--line2:#3A3A43;
--pri:#9D87FF;--pri-d:#B3A2FF;--pri-soft:#2A2340;--pri-ink:#C7BAFF;--on-pri:#140E2B;--acc:#F7BE3A;--acc-soft:#3A2E12;--acc-ink:#F7C95C;--on-acc:#241800;--sk1:#24242A;--sk2:#2E2E35;--fixed-dark:#26223A;
--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--sh-up:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:active{transform:scale(.97)}h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.muted{color:var(--sub)}.small{font-size:13px}.mono{font-family:var(--mono)}
/* 페이지 이동 바 */
#rbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:10000;pointer-events:none;background:color-mix(in srgb,var(--ink) 8%,transparent);opacity:0;transition:opacity .25s}
#rbar.on{opacity:1}#rbar i{display:block;height:100%;clip-path:inset(0 100% 0 0);transition:clip-path 180ms var(--ease);background:linear-gradient(90deg,var(--pri),var(--pri-d))}
/* 버튼·칩·배지 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:700;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--muted-bg)}.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}.btn.pri:hover{background:var(--pri-d)}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--muted-bg);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--pri-soft);color:var(--pri-ink)}.chip.wait{background:var(--acc-soft);color:var(--acc-ink)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:800;color:var(--on-pri);background:var(--pri)}
.tag.new{background:var(--acc);color:var(--on-acc)}.tag.free{background:var(--ink2);color:var(--bg)}.tag.if{background:var(--pri-soft);color:var(--pri-ink)}.tag.dk{background:rgba(0,0,0,.6);color:#fff}
.demo{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;border:1px dashed var(--line2);color:var(--faint)}
/* GNB */
.gnb{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.gnb .in{display:flex;align-items:center;gap:22px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:-.03em;border:0;background:none;padding:0}
.logo b{background:var(--pri);color:var(--on-pri);border-radius:9px;padding:3px 7px;font-size:13px;transform:rotate(-6deg);display:inline-block}
.nav{display:flex;gap:4px}.nav button{position:relative;border:0;background:none;height:40px;padding:0 16px;border-radius:999px;font-weight:700;color:var(--sub);font-size:15px}
.nav button:hover{background:var(--muted-bg);color:var(--ink)}.nav button.on{background:var(--pri);color:var(--on-pri)}
.nav button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.nav .ls{display:none}
.nb{position:relative;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px;line-height:1}
.nb::after{content:'';position:absolute;inset:-3px;border-radius:13px;border:2px solid var(--acc);opacity:0;animation:nbping 2.4s cubic-bezier(.16,1,.3,1) 3}
@keyframes nbping{0%{opacity:.7;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.nb::after{animation:none}}
.libtabs{display:flex;gap:6px;margin:8px 0 22px;border-bottom:1px solid var(--line)}.libtabs button{border:0;background:none;height:44px;padding:0 14px;font-weight:700;font-size:15px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}.libtabs button.on{color:var(--ink);border-bottom-color:var(--pri)}
.rk{display:grid;grid-template-columns:44px 64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink)}.rk:hover{background:var(--muted-bg)}.rk .no{font-size:22px;font-weight:800;color:var(--faint);text-align:center}.rk .no.top{color:var(--pri)}.rk .th{width:64px}.rk b{display:block;font-size:16px}.rk small{color:var(--sub);font-size:13px}.rk .st{font-size:13px;color:var(--sub);text-align:right;white-space:nowrap}
.ifg{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:22px;border-radius:22px;background:var(--surface);box-shadow:var(--sh);margin-bottom:18px}.ifg .o{display:flex;flex-direction:column;gap:10px}.ifg .o .th{width:120px}.ifc{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;width:100%;text-align:left;background:none;color:var(--ink);margin-bottom:10px}.ifc:hover{border-color:var(--pri)}.ifc .th{width:48px;flex:none}.ifc b{display:block}.ifc small{color:var(--sub)}
@media (max-width:600px){.gnb .in{gap:8px}.nav{gap:0}.nav button{padding:0 9px;gap:4px}.nav .lf{display:none}.nav .ls{display:inline}.ifg{grid-template-columns:1fr}.rk{grid-template-columns:30px 48px minmax(0,1fr);gap:10px}.rk .st{display:none}.rk .th{width:48px}}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:42px;min-width:260px;padding:0 8px 0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--faint);font-size:14px;transition:border-color .15s,box-shadow .15s}
.search:hover{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}.search kbd{margin-left:auto;font:600 11px var(--ui);color:var(--sub);background:var(--muted-bg);border-radius:6px;padding:3px 6px}
.thm{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);font-size:16px;display:grid;place-items:center;color:var(--ink)}
.credit{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink);font-weight:800;font-size:13px;border:0}
.avatar{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--pri),var(--acc),var(--pri));padding:2px}.avatar span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:900;font-size:14px;border:2px solid var(--bg)}
main{padding:22px 0 60px}
.foot{border-top:1px solid var(--line);margin-top:20px;padding:26px 0 40px;color:var(--faint);font-size:12.5px}.foot .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.foot b{color:var(--ink);font-weight:900}
.foot .r{margin-left:auto;display:flex;gap:8px}.foot button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--sub)}
/* 홈 */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink2)}
.chips button:hover{border-color:var(--ink)}.chips button.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.guide{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px 12px 18px;border-radius:18px;background:var(--surface);border:1px dashed var(--line2);font-size:14px}
.guide ol{display:flex;gap:6px;margin:0;padding:0;list-style:none;flex-wrap:wrap}.guide li{display:flex;align-items:center;gap:6px;background:var(--muted-bg);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:13px}
.guide li i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font-size:11px;font-weight:800}
.guide .x{margin-left:auto;border:0;background:none;color:var(--faint);font-size:18px;width:32px;height:32px;border-radius:50%}
.hero{position:relative;margin-top:18px}.hero .vp{overflow:hidden;border-radius:24px}
.track{display:flex;gap:14px;transition:transform .42s cubic-bezier(.4,0,.2,1)}
.slide{flex:0 0 calc((100% - 28px)/3);height:400px;border-radius:24px;border:0;padding:0;position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#fff}
.slide .bgart{position:absolute;inset:0;opacity:.35}.slide .bgart svg,.slide .cv svg{width:100%;height:100%;display:block}
.slide .cv{position:relative;width:150px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.35);margin-bottom:22px;transition:transform .5s var(--ease)}.slide:hover .cv{transform:translateY(-6px) scale(1.04)}
.slide h3{position:relative;font-size:22px;font-weight:800;line-height:1.35;letter-spacing:-.03em}.slide p{position:relative;font-size:13.5px;opacity:.85;margin:8px 0 26px}
.slide .tg{position:absolute;left:16px;top:16px;display:flex;gap:4px;z-index:1}.slide.lite{color:#2A241D}
.hero .cnt{position:absolute;right:16px;top:16px;z-index:3;background:rgba(0,0,0,.35);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px}


.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .3s var(--ease),background .3s}.dots i.on{width:22px;background:var(--pri)}
.rings{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 4px}.rings::-webkit-scrollbar{display:none}
.ring{flex:none;border:0;background:none;padding:0;width:84px;text-align:center}
.ring .o{width:78px;height:78px;margin:0 auto;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--acc),var(--pri),var(--pri-d),var(--acc))}.ring.seen .o{background:var(--line2)}
.ring .o span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--bg)}.ring .o svg{width:100%;height:100%;display:block}
.ring b{display:block;font-size:12.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ring small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring.add .o{background:none;border:2px dashed var(--line2);display:grid;place-items:center;font-size:28px;color:var(--pri)}
.sec{margin-top:44px}.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}.sec-h h2{font-size:21px;font-weight:800;letter-spacing:-.03em}
.cont{display:flex;align-items:center;gap:16px;margin-top:22px;padding:14px;border-radius:22px;background:var(--fixed-dark);color:#fff;border:0;width:100%;text-align:left}
.cont .th{width:56px;height:74px;border-radius:10px;overflow:hidden;flex:none}.cont .th svg{width:100%;height:100%;display:block}
.cont small{color:#F7BE3A;font-weight:800;font-size:12px}.cont b{display:block;font-size:17px;margin:2px 0 8px}
.cont .bar{height:5px;background:rgba(255,255,255,.16);border-radius:3px;width:260px;max-width:100%}.cont .bar i{display:block;height:100%;border-radius:3px;background:#B3A2FF}
.cont .go{margin-left:auto;background:#B3A2FF;color:#140E2B;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.tri h3{font-size:17px;font-weight:800;margin-bottom:10px}
.rk{display:grid;grid-template-columns:34px 38px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 6px;border-radius:12px;text-align:left}
.rk:hover{background:var(--surface)}.rk .n{font-size:13px;font-weight:800;color:var(--sub)}.rk .n.top{color:var(--pri)}
.rk .th{width:38px;height:38px;border-radius:50%;overflow:hidden}.rk .th svg{width:100%;height:100%;display:block}
.rk b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk em{font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pick{border:0;background:none;padding:0;text-align:left}.pick b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prox{transition:transform .35s var(--ease);will-change:transform;transform-origin:center bottom}.prox.near{z-index:2;position:relative}
.cov{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--sk1);box-shadow:var(--sh)}
.cov svg{width:100%;height:100%;display:block;transition:transform .6s var(--ease)}.prox.near .cov{box-shadow:var(--sh-up)}.prox.near .cov svg{transform:scale(1.06)}
.cov .tg{position:absolute;left:8px;top:8px;display:flex;gap:3px}.cov .lk{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
.shelf{position:relative}.shelf .row{display:flex;gap:16px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:10px 4px 18px}.shelf .row::-webkit-scrollbar{display:none}
.bk{flex:0 0 168px;border:0;background:none;padding:0;text-align:left}.bk .hk{font-size:14px;font-weight:700;line-height:1.4;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bk small{display:block;color:var(--faint);font-size:12px;margin-top:3px}
.wk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.wc{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:16px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.wc .tgs{display:flex;gap:4px;margin-bottom:6px}.wc h4{font-size:17px;font-weight:800}.wc p{color:var(--sub);font-size:13.5px;margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wc .ft{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.wc .ft i{width:24px;height:24px;border-radius:50%}.wc .ft span{margin-left:auto;color:var(--faint);font-weight:500}.wc .cov{border-radius:10px}
.grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 16px}
.loading .cov::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 37%,var(--sk1) 63%) 0 0/400% 100%;animation:shim 1.2s ease infinite}
.loading .bk .hk,.loading .wc h4,.loading .wc p{color:transparent;background:var(--sk1);border-radius:6px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
#top{position:fixed;right:24px;bottom:24px;z-index:50;width:50px;height:50px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--ink);box-shadow:var(--sh-up);font-size:20px;opacity:0;transform:translateY(12px);pointer-events:none;transition:all .3s var(--ease)}#top.on{opacity:1;transform:none;pointer-events:auto}
/* 뉴트럴 화면(소설·폼·집필) */
.calm{--tbg:var(--bg);--tfg:var(--ink);--tsub:var(--sub);--tacc:var(--pri);--tline:var(--line);--tcard:var(--surface);--tfont:var(--story);--tbtn:var(--pri);--tbtnfg:var(--on-pri);background:var(--tbg);color:var(--tfg);position:relative;isolation:isolate}
.calm.rd{--tbg:var(--read-bg)}.calm-neon{--tfont:var(--ui)}.calm .tcard{box-shadow:var(--sh)}
.band{position:absolute;left:0;right:0;top:0;height:460px;z-index:-1;overflow:hidden;-webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:linear-gradient(#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);opacity:.28;filter:saturate(.7) blur(2px)}.band svg{width:100%;height:100%;display:block}
/* 소설 분위기 테마 (읽기 화면 옵션 전용) */
.th-hanji{--tbg:#F1E8D6;--tfg:#2A241D;--tsub:#7A6A55;--tacc:#7A5C3A;--tline:rgba(70,45,20,.16);--tcard:rgba(255,251,242,.78);--tfont:var(--story);--tbtn:#2A241D;--tbtnfg:#F6EEDC}
.th-star{--tbg:#0A0E24;--tfg:#ECE8F8;--tsub:#A9A6C8;--tacc:#E9C46A;--tline:rgba(255,255,255,.13);--tcard:rgba(255,255,255,.06);--tfont:var(--story);--tbtn:#E9C46A;--tbtnfg:#1B1630}
.th-neon{--tbg:#0B0F14;--tfg:#D3EEF0;--tsub:#7F9AA0;--tacc:#33E1D0;--tline:rgba(51,225,208,.22);--tcard:rgba(18,28,36,.85);--tfont:var(--ui);--tbtn:#33E1D0;--tbtnfg:#04201D}
.themed{background:var(--tbg);color:var(--tfg);position:relative;isolation:isolate}
.th-hanji.themed{background:radial-gradient(1200px 500px at 20% 0%,rgba(255,255,255,.55),transparent 60%),#F1E8D6}
.th-star.themed{background:radial-gradient(900px 500px at 70% -10%,#2A2F6E,transparent 65%),#0A0E24}

function bindHero(){const tr=$('#track');if(!tr){bindHero.step=null;return}const N=tr.children.length;

let PX=[],fine=true,raf=0,mx=-999,my=-999;
addEventListener('touchstart',()=>{fine=false;PX.forEach(el=>{el.style.transform='';el.classList.remove('near')})},{passive:true,once:true});
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(applyProx)},{passive:true});
function applyProx(){raf=0;if(!fine)return;for(const el of PX){const b=el.getBoundingClientRect();if(b.bottom<0||b.top>innerHeight)continue;const d=Math.hypot(mx-(b.left+b.width/2),my-(b.top+b.height/2));const R=Math.max(b.width,b.height)*0.9+60;const t=Math.max(0,1-d/R);const inside=mx>=b.left&&mx<=b.right&&my>=b.top&&my<=b.bottom;el.style.transform=`translateY(${-(inside?6:t*2)}px) scale(${(1+t*0.035+(inside?0.035:0)).toFixed(4)})`;el.classList.toggle('near',inside)}}

 if(act==='startFork'){const w=W[x.dataset.id];const at=+document.querySelector('#epc button.on').dataset.at;const dir=$('#fdir').value.trim(),tit=$('#ftit').value.trim();
  if(!dir)return toast('무엇이 달라지는지 한 줄 적어 주세요');if(!tit||tit.endsWith(':'))return toast('제목을 적어 주세요');
  const f=makeFork(w.id,at,{title:tit,dir,author:'나',owner:'me',mine:true});draftOf(f);toast('원작 '+at+'화 시점을 복사해 포크 소설을 만들었어요');nav('#/forked/'+f.id)}
 if(act==='publish')publishSheet(x.dataset.id);
 if(act==='sim'){syncDraft(a);simSheet(a)}
 if(act==='propose'){syncDraft(a);S.draft[a].proposal='shown';render();setTimeout(()=>{const ap=$('#aiprev');ap&&ap.scrollIntoView({block:'center'})},30);toast('AI 소설 제안이 나왔어요 (크레딧 차감 없음)')}
 if(act==='acceptAI'){const w=W[a],d=S.draft[a];syncDraft(a);d.paras=d.paras.concat(propOf(w));d.proposal='accepted';if(d.check)d.check.stale=true;render();toast('소설에 넣었어요 · 설정 검사를 해 보세요')}
 if(act==='dropAI'){S.draft[a].proposal=null;render();toast('제안을 버렸어요')}
 if(act==='check'){runCheck(a);render();const d=S.draft[a];toast(d.check.issues.length?`${d.check.issues.length}곳이 설정과 어긋나요`:'설정과 어긋난 곳이 없어요')}
 if(act==='fix'){const d=S.draft[a];syncDraft(a);const is=d.check.issues[+x.dataset.i];d.paras=d.paras.map(p=>p.includes(is.sent)?p.replace(is.sent,is.fix):p);runCheck(a,true);render();toast('문장을 고쳤어요 · 다시 검사했어요')}
 if(act==='ignore'){const d=S.draft[a];d.check.issues.splice(+x.dataset.i,1);render();toast('의도한 표현으로 남겼어요')}
 if(act==='pubep'){syncDraft(a);pubEpSheet(a)}
 if(act==='preview'){syncDraft(a);const d=S.draft[a];toast(d.paras.length?`${d.paras.length}문단 · 공개 전 미리보기는 공개 후 회차 뷰어에서 볼 수 있어요`:'아직 소설이 비어 있어요')}
 if(act==='addev'){const w=W[a],d=S.draft[a];(w.ownEvents=w.ownEvents||[]).push([d.no,'f','복선: '+(d.title||'새 사건'),d.links.slice()]);render();toast('이 소설에만 사건을 추가했어요')}
 if(act==='approve'||act==='reject'||act==='resolve'){const it=S.inbox.find(i=>i.id===x.dataset.i);
  if(act==='approve'){const w=W[it.w];w.eps[it.n-1].p[it.pi]=w.eps[it.n-1].p[it.pi].replace(it.from,it.to);it.status='반영 완료'}
  else if(act==='reject')it.status='반려';else{it.status=x.dataset.s;it.answer=act==='resolve'&&$('#ans')?$('#ans').value:null}
  const r=S.reports.find(r=>r.id===it.rid);if(r){r.status=it.status==='반영 완료'?'반영 완료':it.status==='반려'?'반려':'답변 완료';if(it.answer)r.reply='작가 답변: '+it.answer}
  render();toast(act==='approve'?'원문에 반영하고 독자에게 알렸어요':'처리했어요. 독자에게 알렸어요')}
 if(act==='pickfile'){IMP.picked=true;render()}
 if(act==='startimp'){IMP.ok=$('#iok').checked;if(!IMP.ok)return toast('AI로 처리할 권리에 체크해 주세요');IMP.step=0;render();clearInterval(IMP.timer);IMP.timer=setInterval(()=>{IMP.step++;if(getH().startsWith('#/import'))render();if(IMP.step>=5)clearInterval(IMP.timer)},420)}
 if(act==='reimp'){IMP.step=0;render();clearInterval(IMP.timer);IMP.timer=setInterval(()=>{IMP.step++;if(getH().startsWith('#/import'))render();if(IMP.step>=5)clearInterval(IMP.timer)},420)}
 if(act==='saveimp'){if(W.chunhyang)return toast('이미 저장했어요');
  orig({id:'chunhyang',title:'춘향전 (가져온 소설)',theme:'hanji',genre:'고전 로맨스',author:'나',owner:'me',kind:IMP.kind,rights:IMP.kind==='다른 사람 소설'?'미확인':'확인됨',private:true,by:'가져온 소설 · '+IMP.kind,tags:[],hash:['#광한루','#고전리메이크'],likes:0,views:0,cmts:0,upd:0,hero:['단옷날 광한루,','그네 타던 소녀'],heroBg:'#5B4A3A',hook:'단옷날, 그네 위의 춘향',summary:'남원 광한루에서 만난 춘향과 몽룡의 소설.',forkFrom:2,
   cast:IMPORT.cast.map((c,i)=>({n:c.split(' · ')[0],c:AV[i%AV.length],d:c.split(' · ')[1]||'',st:'—'})),rules:IMPORT.world.filter(x=>x.startsWith('규칙')).map(x=>x.slice(4)),events:IMPORT.events.map(e=>[+e[0],'m',e.slice(3),[]]),
   eps:[{t:'광한루',p:['단옷날, 남원 광한루 앞 버드나무에 그네가 걸렸다.','이몽룡은 그네 위의 소녀에게서 눈을 떼지 못했다.']}]});
  if(W.chunhyang.rights==='미확인')W.chunhyang.forksAllowed=false;S.imported=1;toast('세계관·인물·사건을 저장했어요 (비공개 상태)');nav('#/lib?tab=write')}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();quick()}if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
window.addEventListener('resize',()=>{bindHero.step&&bindHero.step()});
window.__SF={W,S,hash};  // 검수용
render();
})();
</script></body></html>
