name: Deploy

on:
  workflow_run:
    workflows: [Images]
    # Images workflow_run 자체의 브랜치는 기본 main이며 게시 대상 develop이 아니다.
    types: [completed]
  workflow_dispatch:
    inputs:
      images_run_id:
        description: Completed successful Images run ID for current develop HEAD
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy develop images
    if: ${{ vars.DEVELOP_CD_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: develop-cd
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    concurrency:
      group: storyfork-develop-cd
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGES_RUN_ID: ${{ inputs.images_run_id }}
      CD_DEPLOY_DIR: ${{ vars.CD_DEPLOY_DIR }}
      CD_WEB_PORT: ${{ vars.CD_WEB_PORT }}
      CD_SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
      CD_SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
    steps:
      # 배포 스크립트와 Compose도 대상/PR 코드가 아닌 신뢰하는 기본 브랜치를 사용한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify publication source, exact CI and Images attempt and provisioning inputs
        run: python3 -I infrastructure/scripts/deploy-develop.py check
      - name: Join deployment tailnet with workload identity federation
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:storyfork-cd
      - name: Pull all images, deploy isolated project and verify health
        run: python3 -I infrastructure/scripts/deploy-develop.py deploy
