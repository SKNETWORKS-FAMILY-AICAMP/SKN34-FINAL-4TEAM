name: Mobile CD

# iOS 시뮬레이터용 Release .app(서명 없음)을 만들어 고정 prerelease(mobile-ios-latest)에 올린다(#943).
# 트리거·가드는 publish-images.yml(CD)과 같다. 유료 Apple 계정이 없어 기기·TestFlight 배포는 하지 않는다.
on:
  workflow_run:
    workflows: [CI]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: mobile-ios-latest

concurrency:
  group: storyfork-mobile-ios-cd
  cancel-in-progress: false

jobs:
  changes:
    name: Detect mobile changes
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # 수동 실행은 항상 빌드한다. CI 성공으로 시작했으면 마지막으로 올린 빌드(태그의 커밋)와 비교해 mobile/이 달라졌을 때만 빌드한다.
          # 뒤이은 push가 CI를 취소하거나 대기 중 run이 교체돼 건너뛴 변경도 다음 run이 싣는다. 태그가 없으면(첫 빌드) 대상 커밋의 첫 부모와 비교한다.
          mobile=true
          if [[ "$EVENT" == workflow_run ]]; then
            base=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || printf '%s^1' "$TARGET_SHA")
            changed=$(git diff --name-only "$base" "$TARGET_SHA" -- mobile)
            printf 'mobile changes against %s:\n%s\n' "$base" "${changed:-(none)}"
            [[ -n "$changed" ]] || mobile=false
          fi
          printf 'mobile=%s\n' "$mobile" >> "$GITHUB_OUTPUT"

  build:
    name: Build iOS simulator app
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: (cd ios && pod install)
      - name: Build the unsigned Release app for the simulator
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
        run: |
          set -euo pipefail
          # 저장소 변수가 없으면 빈 문자열이다. 그때는 export하지 않아 앱 기본값(http://localhost:5173)이 번들에 들어간다.
          if [[ -n "${MOBILE_API_BASE_URL:-}" ]]; then export EXPO_PUBLIC_API_BASE_URL="$MOBILE_API_BASE_URL"; fi
          xcodebuild -workspace ios/STORYFORK.xcworkspace -scheme STORYFORK -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/STORYFORK.app STORYFORK-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STORYFORK-ios-simulator
          path: mobile/STORYFORK-ios-simulator.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Update iOS simulator release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: STORYFORK-ios-simulator
          path: dist
      - name: Replace the release asset, then move the tag to the built commit
        run: |
          set -euo pipefail
          if [[ -n "${MOBILE_API_BASE_URL:-}" ]]; then server="$MOBILE_API_BASE_URL"; else server='http://localhost:5173 (앱 기본값, 로컬 Compose의 web)'; fi
          {
            printf 'iOS 시뮬레이터 전용 개발 빌드입니다. 서명이 없어 실제 기기에는 설치되지 않습니다.\n\n'
            printf -- '- 커밋: %s\n' "$TARGET_SHA"
            printf -- '- 서버 주소: %s\n' "$server"
            printf -- '- 설치: zip을 풀고 `xcrun simctl install booted STORYFORK.app`, 실행은 `xcrun simctl launch booted com.storyfork.app`\n'
          } > notes.md
          title='iOS 시뮬레이터 빌드 (develop)'
          # 릴리스 편집은 이미 있는 태그를 옮기지 않으므로 태그 ref는 직접 대상 커밋으로 옮기거나 만든다.
          move_tag() {
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$TARGET_SHA" -F force=true >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" >/dev/null
            fi
          }
          # 태그는 다음 실행이 '어느 커밋까지 올렸는지' 비교하는 기준이라, 릴리스가 이미 있으면 zip 교체·본문 갱신을 먼저 하고 태그는 마지막에 옮긴다.
          # 중간에 실패하면 태그가 옛 커밋에 남아 다음 실행이 그 변경을 다시 싣는다(태그를 먼저 옮기면 zip은 옛 빌드인데 '변경 없음'으로 건너뛴다).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/STORYFORK-ios-simulator.zip --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease
            move_tag
          else
            # 새 릴리스는 --verify-tag가 이미 있는 태그를 요구하므로 태그를 먼저 만들거나 옮긴다.
            move_tag
            gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md --prerelease
            gh release upload "$TAG" dist/STORYFORK-ios-simulator.zip --clobber
          fi
