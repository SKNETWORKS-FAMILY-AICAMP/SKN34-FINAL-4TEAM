name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # 비교 기준이 없는 수동 실행은 모든 서비스/시나리오를 선택한다.
  workflow_dispatch:
    inputs:
      record_android:
        description: Android 에뮬레이터 시연 녹화
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 격리된 CI 전용 값이다. 저장소/서버의 실제 .env·secrets는 사용하지 않는다.
env:
  DATABASE_USER: content_test
  DATABASE_PASSWORD: ci-test-only
  DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/storyfork_test
  CORE_SMTP_HOST: 127.0.0.1
  CORE_SMTP_PORT: "1025"
  AUTH_PUBLIC_ORIGIN: http://127.0.0.1:8088
  AUTH_MAIL_FROM: ci@example.invalid
  AUTH_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  AUTH_COOKIE_SECURE: "false"
  INTERNAL_TOKEN: ci-test-only-internal-token
  CONTENT_CORE_AUTH_TOKEN: ci-content-core-auth-only-0123456789abcdef
  NEO4J_PASSWORD: ci-test-only-graph
  CORE_RABBITMQ_PASSWORD: ci-test-only-broker
  OPERATIONS_SERVICE_TOKEN: ci-test-only-operations-token
  OPENAI_API_KEY: ""
  OPENAI_MODEL: ""

jobs:
  changes:
    name: Changed paths and selection checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      service: ${{ steps.plan.outputs.service }}
      service_needed: ${{ steps.plan.outputs.service_needed }}
      system: ${{ steps.plan.outputs.system }}
      system_needed: ${{ steps.plan.outputs.system_needed }}
      infra: ${{ steps.plan.outputs.infra }}
      mobile: ${{ steps.plan.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 infrastructure/ci/ci.py plan
      - if: ${{ steps.plan.outputs.service_needed == 'true' }}
        run: python3 -m unittest discover -s infrastructure/ci -p 'test_*.py' -v

  mobile:
    name: Mobile typecheck and unit tests
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  android-demo:
    name: Android emulator demo
    needs: mobile
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: storyfork_test
          POSTGRES_USER: content_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U content_test -d storyfork_test" --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: storyfork
          RABBITMQ_DEFAULT_PASS: ci-mobile-broker
        ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MOBILE_WEB_URL: http://127.0.0.1:5173/notifications
      AUTH_PUBLIC_ORIGIN: http://127.0.0.1:5173
      CORE_RABBITMQ_HOST: 127.0.0.1
      CORE_RABBITMQ_USER: storyfork
      CORE_RABBITMQ_PASSWORD: ci-mobile-broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Start the Android emulator
        run: |
          sudo chown "$USER" /dev/kvm
          sdkmanager "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --name storyfork-ci --package "system-images;android-35;google_apis;x86_64"
          nohup "$ANDROID_HOME/emulator/emulator" -avd storyfork-ci -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
      - name: Build the Android development APK
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Start actual Core, web and Metro
        run: |
          pnpm --dir frontend install --frozen-lockfile
          (cd backend/core-api && ./gradlew bootJar --no-daemon)
          nohup java -jar backend/core-api/build/libs/*-SNAPSHOT.jar > "$RUNNER_TEMP/core.log" 2>&1 &
          nohup pnpm --dir frontend dev --host 127.0.0.1 > "$RUNNER_TEMP/web.log" 2>&1 &
          (cd mobile && nohup npx expo start --localhost --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &)
          for url in http://127.0.0.1:5173/api/v1/health http://127.0.0.1:8081/status; do
            curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 2 "$url"
          done
      - name: Record actual WebView login, local notification and tap
        run: |
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
          node mobile/scripts/android-demo.mjs "$RUNNER_TEMP/storyfork-android"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storyfork-android-943
          path: |
            ${{ runner.temp }}/storyfork-android/
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  configuration:
    name: Compose configuration
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CD_DIRECTORY: /configuration-test
      CD_WEB_PORT: "8088"
      # Configuration-only synthetic values; no published image is pulled or started here.
      DATABASE_USER: synthetic-config-user
      DATABASE_PASSWORD: synthetic-config-password
      AUTH_PUBLIC_ORIGIN: https://production-config.invalid
      AUTH_MAIL_FROM: ci@example.invalid
      AUTH_JWT_SECRET: synthetic-config-only
      CONTENT_CORE_AUTH_TOKEN: synthetic-config-only
      INTERNAL_TOKEN: synthetic-config-only
      NEO4J_PASSWORD: synthetic-config-only
      CORE_RABBITMQ_PASSWORD: synthetic-config-only
      OPERATIONS_SERVICE_TOKEN: synthetic-config-only
      OPENAI_API_KEY: synthetic-config-only
      # develop·production이 include하는 Langfuse의 필수 값. 보간만 확인하므로 형식은 보지 않는다.
      LANGFUSE_PUBLIC_KEY: synthetic-config-only
      LANGFUSE_SECRET_KEY: synthetic-config-only
      LANGFUSE_CLICKHOUSE_PASSWORD: synthetic-config-only
      LANGFUSE_REDIS_PASSWORD: synthetic-config-only
      LANGFUSE_NEXTAUTH_SECRET: synthetic-config-only
      LANGFUSE_SALT: synthetic-config-only
      LANGFUSE_ENCRYPTION_KEY: synthetic-config-only
      WEB_PORT: "18088"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate default local entrypoint and base + local/prod/dev
        run: |
          docker compose --env-file .env.example config --quiet
          for mode in local prod dev; do
            docker compose --env-file .env.example -f infrastructure/docker-compose.yaml -f "infrastructure/docker-compose.$mode.yaml" config --quiet
          done
      - name: Validate isolated CI overlay
        run: docker compose --env-file .env.example -p storyfork-ci-config -f infrastructure/docker-compose.yaml -f infrastructure/docker-compose.local.yaml -f infrastructure/ci/compose.test.yaml config --quiet
      - name: Validate optional attachment environment contract
        run: python3 -I -m unittest discover -s infrastructure/tests -p test_attachment_environment.py -v
      - name: Validate sample CSV import contract without a database
        run: python3 -I -m unittest discover -s infrastructure/sample-data -p 'test_*.py' -v
      - name: Validate myth template sources without a database
        run: python3 -I -m unittest discover -s infrastructure/sample-data/genre-templates -p test_traditions.py -v
      - name: Validate expanded world data without a database
        run: python3 -I -m unittest discover -s infrastructure/sample-data/genre-templates -p expanded_test.py -v
      - name: Validate expanded world relations without a database
        run: python3 -I -m unittest discover -s infrastructure/sample-data/genre-templates/expanded-relations -p test_merge.py -v
      - name: Validate simulation demo worlds without a database
        run: python3 -I -m unittest discover -s infrastructure/sample-data/simulation-demo -p 'test_*.py' -v

  # 서비스마다 job 하나다. 한 러너에서 빌드 → 단위 → 통합 순서로 실행하고 앞 단계가 실패하면 뒤 단계는 실행하지 않는다.
  # 서비스끼리는 병렬이다. 통합에 쓰는 postgres·neo4j·elasticsearch·mailpit은 해당 서비스에만 띄운다(image가 비면 건너뛴다).
  service:
    name: Service / ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.service_needed == 'true' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.service) }}
    services:
      postgres:
        # Core·Content·Operations 통합 job마다 서로 격리된 임시 DB를 생성한다.
        image: ${{ (matrix.service == 'core' || matrix.service == 'content' || matrix.service == 'operations') && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: storyfork_test
          POSTGRES_USER: content_test
          # 기존 Content *PostgresTest의 content_test/빈 비밀번호 계약. 격리 runner 전용.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U content_test -d storyfork_test" --health-interval 3s --health-timeout 3s --health-retries 20
      postgres-password:
        # WorldStudio migration 테스트만 비밀번호 인증에서도 재실행한다. 기존 trust DB는 유지한다.
        image: ${{ matrix.service == 'content' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: worldstudio_password_test
          POSTGRES_USER: worldstudio_test
          POSTGRES_PASSWORD: worldstudio-ci-password
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports: ["127.0.0.1:5433:5432"]
        options: --health-cmd "pg_isready -U worldstudio_test -d worldstudio_password_test" --health-interval 3s --health-timeout 3s --health-retries 20
      neo4j:
        # Content integration only; isolated runner storage, no external graph or paid calls.
        image: ${{ matrix.service == 'content' && 'neo4j:5.26.0-community' || '' }}
        env:
          NEO4J_AUTH: neo4j/worldstudio-ci-graph-password
        ports: ["127.0.0.1:7687:7687"]
        options: --health-cmd "cypher-shell -u neo4j -p worldstudio-ci-graph-password 'RETURN 1'" --health-interval 5s --health-timeout 5s --health-start-period 30s --health-retries 30
      elasticsearch:
        # Content integration only: 원고 색인은 항상 켜져 있어 Spring 컨텍스트가 시작할 때 색인을 만들고 매핑을 검증한다. 격리 runner 전용(보안 끔, loopback만).
        image: ${{ matrix.service == 'content' && 'docker.elastic.co/elasticsearch/elasticsearch:9.5.6' || '' }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["127.0.0.1:9200:9200"]
        options: --health-cmd "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s'" --health-interval 5s --health-timeout 5s --health-start-period 60s --health-retries 24
      mailpit:
        image: ${{ matrix.service == 'core' && 'axllent/mailpit:v1.27' || '' }}
        ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    env:
      DATABASE_PASSWORD: ""
      TEST_CONTENT_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/storyfork_test
      TEST_OPERATIONS_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/storyfork_test
      TEST_OPERATIONS_DATABASE_USER: content_test
      TEST_OPERATIONS_DATABASE_PASSWORD: ""
      # Each WorldStudio fixture owns a separate temporary database in this CI service.
      TEST_WORLDSTUDIO_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/storyfork_test
      TEST_WORLDSTUDIO_DATABASE_USER: content_test
      TEST_WORLDSTUDIO_DATABASE_PASSWORD: ""
      TEST_WORLDSTUDIO_DISPOSABLE: "true"
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: worldstudio-ci-graph-password
      NEO4J_DATABASE: neo4j
      AUTH_INTEGRATION_TEST: "true"
      AUTH_MAILPIT_API: http://127.0.0.1:8025
      # 첨부 통합 테스트: 아래 단계가 띄우는 임시 MinIO와 전용 DB. CI 전용 가짜 자격이다.
      TEST_ATTACHMENT_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/attachment_test
      TEST_ATTACHMENT_S3_ENDPOINT: http://127.0.0.1:19087
      AWS_ACCESS_KEY_ID: ci-test-only-minio
      AWS_SECRET_ACCESS_KEY: ci-test-only-minio-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - if: ${{ matrix.service == 'web' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - if: ${{ matrix.service == 'web' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: ${{ matrix.service == 'core' || matrix.service == 'content' || matrix.service == 'operations' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          # 키를 서비스별로 가른다. 기본 키는 세 서비스를 한 캐시로 묶어 먼저 저장한 서비스의 의존성만 남는다.
          cache-dependency-path: |
            backend/${{ matrix.service }}*/*.gradle*
            backend/${{ matrix.service }}*/gradle/wrapper/gradle-wrapper.properties
      - if: ${{ matrix.service == 'ai' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend/ai-service
          enable-cache: true
          cache-dependency-glob: backend/ai-service/uv.lock
      - if: ${{ matrix.service == 'web' }}
        run: pnpm --dir frontend install --frozen-lockfile
      # 1) 빌드: 서비스 이미지를 만드는 것과 같은 작업을 먼저 확인한다.
      - name: Build web (lint and bundle)
        if: ${{ matrix.service == 'web' }}
        run: pnpm --dir frontend lint && pnpm --dir frontend build
      - name: Build Core jar (same task as the image build)
        if: ${{ matrix.service == 'core' }}
        working-directory: backend/core-api
        run: ./gradlew bootJar --no-daemon
      - name: Build Content jar (same task as the image build)
        if: ${{ matrix.service == 'content' }}
        working-directory: backend/content-service
        run: ./gradlew bootJar --no-daemon
      - name: Build Operations jar (same task as the image build)
        if: ${{ matrix.service == 'operations' }}
        working-directory: backend/operations-service
        run: ./gradlew bootJar --no-daemon
      - name: Check AI dependency lock (no compile step)
        if: ${{ matrix.service == 'ai' }}
        run: uv lock --check --directory backend/ai-service
      # 2) 단위: 빌드가 성공한 뒤에만 실행한다.
      - name: Vitest unit tests (isolated modules only)
        if: ${{ matrix.service == 'web' }}
        working-directory: frontend
        run: pnpm exec vitest run src/domain src/data src/index-html.test.js --reporter=default --reporter=junit --outputFile=reports/unit.xml
      - name: JUnit unit tests (selected feature packages)
        if: ${{ matrix.service == 'core' }}
        working-directory: backend/core-api
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          filters=()
          if [[ "$SCOPE" != all ]]; then
            for feature in ${SCOPE//,/ }; do
              case "$feature" in
                auth) packages=("$feature") ;;
                health) packages=(_health _health_ai_service _common) ;;
                *) exit 1 ;;
              esac
              for package in "${packages[@]}"; do filters+=(--tests "ai.storyfork.core.$package.*"); done
            done
          fi
          ./gradlew unitTest --no-daemon "${filters[@]}"
      - name: JUnit Content pure unit tests (integration excluded)
        if: ${{ matrix.service == 'content' }}
        working-directory: backend/content-service
        run: ./gradlew unitTest --no-daemon
      - name: JUnit Operations pure unit tests (integration excluded)
        if: ${{ matrix.service == 'operations' }}
        working-directory: backend/operations-service
        run: ./gradlew unitTest --no-daemon
      - name: pytest isolated provider unit tests
        if: ${{ matrix.service == 'ai' }}
        working-directory: backend/ai-service
        run: uv run --locked --extra dev python -m pytest -m 'not integration' --junitxml=reports/unit.xml
      # 3) 통합: 단위가 모두 성공한 뒤에만 실행한다(통합 테스트 단계에는 상태 조건을 두지 않는다). 아래 보고·정리 단계만 실패 때도 돈다.
      - name: Vitest React integration tests (exclude unit files)
        if: ${{ matrix.service == 'web' }}
        working-directory: frontend
        run: pnpm exec vitest run --exclude 'src/domain/**' --exclude 'src/data/**' --exclude src/index-html.test.js --reporter=default --reporter=junit --outputFile=reports/integration.xml
      - name: JUnit Spring/HTTP/PostgreSQL integration tests
        if: ${{ matrix.service == 'core' }}
        working-directory: backend/core-api
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          filters=()
          if [[ "$SCOPE" != all ]]; then
            for feature in ${SCOPE//,/ }; do
              case "$feature" in
                auth) packages=("$feature") ;;
                health) packages=(_health _health_ai_service _common) ;;
                *) exit 1 ;;
              esac
              for package in "${packages[@]}"; do filters+=(--tests "ai.storyfork.core.$package.*"); done
            done
          fi
          ./gradlew integrationTest --no-daemon "${filters[@]}"
      - name: Start isolated MinIO and attachment database for Content
        if: ${{ matrix.service == 'content' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          minio="ghcr.io/sknetworks-family-aicamp/storyfork-minio:$(grep -oE 'RELEASE\.[0-9TZ-]+' infrastructure/minio/Dockerfile | head -1)"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin || true
          docker pull "$minio" || docker build --tag "$minio" infrastructure/minio
          docker run -d --name ci-minio -p 127.0.0.1:19087:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" "$minio" server /data
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:19087/minio/health/live >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:19087/minio/health/live >/dev/null
          docker exec "$POSTGRES_ID" createdb -U content_test attachment_test
      - name: Set up uv for Content acceptance provider
        if: ${{ matrix.service == 'content' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Start fixture-only AI for initial world HTTP acceptance
        if: ${{ matrix.service == 'content' }}
        run: |
          uv sync --locked --extra dev --project backend/ai-service
          backend/ai-service/.venv/bin/python docs/verification/two-path-qa/provider_server.py > "$RUNNER_TEMP/initial-build-provider.log" 2>&1 &
          echo "MANUSCRIPT_QA_AI_URL=http://127.0.0.1:8769" >> "$GITHUB_ENV"
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail --silent --show-error http://127.0.0.1:8769/qa/status
      - name: JUnit Content Spring HTTP and fresh PostgreSQL integration tests
        if: ${{ matrix.service == 'content' }}
        working-directory: backend/content-service
        run: ./gradlew integrationTest --no-daemon
      - name: Preserve initial world acceptance evidence
        if: ${{ always() && matrix.service == 'content' }}
        run: python3 infrastructure/ci/ci.py reports initial-build-evidence backend/content-service/build/qa backend/content-service/build/test-results/integrationTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && matrix.service == 'content' }}
        with:
          name: initial-world-http-db-evidence
          path: initial-build-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: JUnit Operations service-auth HTTP and PostgreSQL CRUD integration tests
        if: ${{ matrix.service == 'operations' }}
        working-directory: backend/operations-service
        run: ./gradlew integrationTest --no-daemon
      - name: WorldStudio migration with PostgreSQL password authentication
        if: ${{ matrix.service == 'content' }}
        working-directory: backend/content-service
        env:
          TEST_WORLDSTUDIO_DATABASE_URL: jdbc:postgresql://127.0.0.1:5433/worldstudio_password_test
          TEST_WORLDSTUDIO_DATABASE_USER: worldstudio_test
          TEST_WORLDSTUDIO_DATABASE_PASSWORD: worldstudio-ci-password
          TEST_WORLDSTUDIO_PASSWORD_AUTH: "true"
        run: ./gradlew integrationTest --tests ai.storyfork.content.world.WorldStudioMigrationPostgresTest --no-daemon --rerun
      - name: pytest FastAPI HTTP integration tests
        if: ${{ matrix.service == 'ai' }}
        working-directory: backend/ai-service
        run: uv run --locked --extra dev python -m pytest -m integration --junitxml=reports/integration.xml
      - name: Collect isolated dependency logs
        if: ${{ failure() && (matrix.service == 'core' || matrix.service == 'content' || matrix.service == 'operations') }}
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
          PASSWORD_POSTGRES_ID: ${{ job.services.postgres-password.id }}
          MAILPIT_ID: ${{ job.services.mailpit.id }}
          NEO4J_ID: ${{ job.services.neo4j.id }}
          ELASTICSEARCH_ID: ${{ job.services.elasticsearch.id }}
        run: |
          docker logs "$POSTGRES_ID" > "$RUNNER_TEMP/postgres.log" 2>&1 || true
          if [[ -n "$PASSWORD_POSTGRES_ID" ]]; then docker logs "$PASSWORD_POSTGRES_ID" >> "$RUNNER_TEMP/postgres.log" 2>&1 || true; fi
          if [[ -n "$MAILPIT_ID" ]]; then docker logs "$MAILPIT_ID" > "$RUNNER_TEMP/mailpit.log" 2>&1 || true; fi
          if [[ -n "$NEO4J_ID" ]]; then docker logs "$NEO4J_ID" > "$RUNNER_TEMP/neo4j.log" 2>&1 || true; fi
          if [[ -n "$ELASTICSEARCH_ID" ]]; then docker logs "$ELASTICSEARCH_ID" > "$RUNNER_TEMP/elasticsearch.log" 2>&1 || true; fi
      - name: Sanitize failure reports
        if: ${{ failure() }}
        run: python3 infrastructure/ci/ci.py reports sanitized frontend/reports backend/core-api/build/test-results backend/content-service/build/test-results backend/operations-service/build/test-results backend/ai-service/reports "$RUNNER_TEMP/postgres.log" "$RUNNER_TEMP/mailpit.log" "$RUNNER_TEMP/neo4j.log" "$RUNNER_TEMP/elasticsearch.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: service-${{ matrix.service }}
          path: sanitized/
          retention-days: 7
          if-no-files-found: ignore
      # Actions service containers/volumes는 job 종료 시 runner가 정리한다.

  system:
    name: Selected HTTP system scenarios
    needs: [changes, service, configuration]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.service.result == 'success' && (needs.configuration.result == 'success' || needs.configuration.result == 'skipped') && needs.changes.outputs.system_needed == 'true' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: storyfork-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: infrastructure/docker-compose.yaml:infrastructure/docker-compose.local.yaml:infrastructure/ci/compose.test.yaml
      SCENARIOS: ${{ needs.changes.outputs.system }}
      # compose 필수값만 채운다. compose.test.yaml이 ai-service의 실제 키를 빈 값으로 덮어 503을 검증한다.
      OPENAI_API_KEY: ci-unused-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend/ai-service
          enable-cache: true
          cache-dependency-glob: backend/ai-service/uv.lock
      # compose build의 type=gha 레이어 캐시용: buildx builder와 Actions 캐시 토큰을 준비한다.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Reuse the pinned MinIO image (build once only when it is not published yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          minio="ghcr.io/sknetworks-family-aicamp/storyfork-minio:$(grep -oE 'RELEASE\.[0-9TZ-]+' infrastructure/minio/Dockerfile | head -1)"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin || true
          docker pull "$minio" || docker build --load --tag "$minio" infrastructure/minio
      - name: Launch only the isolated CI Compose project
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 240
      - name: Discover loopback ports and wait for HTTP readiness
        run: |
          HTTP_BASE_URL="http://$(docker compose --env-file .env.example port web 80)"
          MAILPIT_API_URL="http://$(docker compose --env-file .env.example port mailpit 8025)"
          printf '%s\n' "HTTP_BASE_URL=$HTTP_BASE_URL" "MAILPIT_API_URL=$MAILPIT_API_URL" >> "$GITHUB_ENV"
          for url in "$HTTP_BASE_URL/api/v1/health" "$HTTP_BASE_URL/api/v1/health/ai-service" "$HTTP_BASE_URL/api/v1/public/works" "$MAILPIT_API_URL/api/v1/messages"; do
            curl --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 --fail --silent --show-error --output /dev/null "$url"
          done
      - name: pytest selected real HTTP and persistence flows
        # 기존 AI dev extra의 pytest/httpx2를 재사용한다. 별도 테스트 엔진·wrapper는 없다.
        run: uv run --locked --extra dev --project backend/ai-service python -m pytest infrastructure/system -k "${SCENARIOS//,/ or }" --junitxml=reports/system.xml --tb=no --show-capture=no -q
      - name: Collect failure logs without printing bodies or credentials
        if: ${{ failure() }}
        run: |
          docker compose --env-file .env.example logs --no-color > "$RUNNER_TEMP/system.log" 2>&1 || true
          python3 infrastructure/ci/ci.py reports sanitized reports "$RUNNER_TEMP/system.log"
      - name: Remove only this run's containers and test resources
        if: ${{ always() }}
        run: docker compose --env-file .env.example down --volumes --remove-orphans --timeout 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: system-http
          path: sanitized/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [changes, configuration, service, system, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject failures, cancellations and unexpected skips
        env:
          NEEDS: ${{ toJSON(needs) }}
          SERVICE_NEEDED: ${{ needs.changes.outputs.service_needed }}
          SYSTEM_NEEDED: ${{ needs.changes.outputs.system_needed }}
          CONFIGURATION_NEEDED: ${{ needs.changes.outputs.infra }}
          MOBILE_NEEDED: ${{ needs.changes.outputs.mobile }}
        run: python3 infrastructure/ci/ci.py required
