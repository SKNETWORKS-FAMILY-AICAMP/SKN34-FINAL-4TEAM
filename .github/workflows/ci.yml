name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter가 PR 변경 파일 목록을 API로 읽는다.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # develop CD를 중간 취소하지 않는다. 대기 중 오래된 실행은 HEAD 검사에서 차단한다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 푸시는 같은 브랜치의 직전 커밋과 비교한다. PR·수동 실행은 빈 값으로 기본 비교를 쓴다.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            web: ['frontend/**', '.github/workflows/ci.yml']
            core: ['backend/core-api/**', '.github/workflows/ci.yml']
            ai: ['backend/ai-service/**', '.github/workflows/ci.yml']
            infra: ['infrastructure/**', '.env.example', '.github/workflows/ci.yml']

  repository:
    name: Whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace in changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 수동 실행·새 브랜치 푸시는 기준선이 없으므로 부모 커밋과 비교한다.
          # 브랜치 전체 변경은 PR 실행에서 base와 비교해 검사한다.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify --quiet HEAD^ || git hash-object -t tree /dev/null)"
          fi
          echo "base: $BASE"
          git diff --check "$BASE" HEAD

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  core-api:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    name: Core API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/core-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew clean test --no-daemon

  ai-service:
    needs: changes
    if: ${{ needs.changes.outputs.ai == 'true' }}
    name: AI Service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend/ai-service
          enable-cache: true
          cache-dependency-glob: backend/ai-service/uv.lock
      - run: uv lock --check
      - run: uv run --locked --extra dev python -m pytest

  infrastructure:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover infrastructure/tests
      - run: python3 -I infrastructure/scripts/check-compose-config.py
<<<<<<< HEAD
      - run: python3 -I infrastructure/scripts/check-content-config.py
=======
      - run: python3 -I infrastructure/scripts/test-publish-preflight.py
      - run: python3 -I infrastructure/scripts/test-deploy-develop.py
>>>>>>> fe9ddd85058789d3ae70f142a69dbca7508e603f
      - run: bash -n infrastructure/scripts/verify-compose.sh

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [changes, repository, web, core-api, ai-service, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when any required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  publish:
    name: Publish ${{ matrix.service }} image
    needs: required
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.required.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: frontend
          - service: core-api
            context: backend/core-api
          - service: ai-service
            context: backend/ai-service
    env:
      IMAGE: ghcr.io/sknetworks-family-aicamp/storyfork-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:sha-$GITHUB_SHA" \
            "${{ matrix.context }}"
      - name: Check anonymous package access
        run: |
          python3 - <<'PY'
          # preflight-start
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          image = os.environ['IMAGE'].removeprefix('ghcr.io/')
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{image}:pull'})
          try:
              with urllib.request.urlopen('https://ghcr.io/token?' + query, timeout=10) as response:
                  status, body = response.status, response.read()
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read()
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit('GHCR anonymous access check failed; publishing stopped')
          try:
              data = json.loads(body)
              errors = data.get('errors') if isinstance(data, dict) else None
              denied = isinstance(errors, list) and len(errors) == 1 and isinstance(errors[0], dict) and (status, errors[0].get('code')) in {(401, 'UNAUTHORIZED'), (403, 'DENIED')}
          except (ValueError, UnicodeError):
              denied = False
          if not denied:
              raise SystemExit(f'GHCR anonymous access check returned HTTP {status}; publishing stopped')
          print('GHCR denied anonymous access; package visibility is not guaranteed')
          # preflight-end
          PY
      - name: Verify current branch HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          # branch-head-start
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = urllib.parse.quote(os.environ['GITHUB_REPOSITORY'], safe='/')
          branch = urllib.parse.quote(os.environ['GITHUB_REF_NAME'], safe='')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/ref/heads/{branch}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  current_sha = json.load(response)['object']['sha']
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('Branch HEAD lookup failed; publishing stopped')
          if current_sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch HEAD differs from event SHA; publishing stopped')
          # branch-head-end
          PYTHON
      - name: Push image tags
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"

  deploy:
    name: Deploy develop images
    needs: [required, publish]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.required.result == 'success' && needs.publish.result == 'success' && vars.DEVELOP_CD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: develop-cd
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    concurrency:
      group: storyfork-develop-cd
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CD_DEPLOY_DIR: ${{ vars.CD_DEPLOY_DIR }}
      CD_WEB_PORT: ${{ vars.CD_WEB_PORT }}
      CD_SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
      CD_SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact push, publish attempt and provisioning inputs
        run: python3 -I infrastructure/scripts/deploy-develop.py check
      - name: Join deployment tailnet with workload identity federation
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:storyfork-cd
      - name: Pull all images, deploy isolated project and verify health
        run: python3 -I infrastructure/scripts/deploy-develop.py deploy
