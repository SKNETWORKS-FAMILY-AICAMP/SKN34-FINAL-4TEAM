name: Images

on:
  workflow_run:
    workflows: [CI]
    branches: [develop, main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: images-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify successful CI
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      branch: ${{ steps.ci.outputs.branch }}
    steps:
      # Gate 코드는 선택한 대상이 아닌 신뢰하는 기본 브랜치에서 실행한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify exact-SHA Required CI evidence
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_SOURCE_PATH: ${{ runner.temp }}/publication-source.json
        run: python3 -I infrastructure/scripts/check-publish-ci.py
      - name: Record validated publication source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-source.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.service }} image
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: frontend
          - service: core-api
            context: backend/core-api
          - service: ai-service
            context: backend/ai-service
    env:
      IMAGE: ghcr.io/sknetworks-family-aicamp/storyfork-${{ matrix.service }}
      TARGET_SHA: ${{ needs.gate.outputs.sha }}
      TARGET_BRANCH: ${{ needs.gate.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --tag "$IMAGE:$TARGET_BRANCH" --tag "$IMAGE:sha-$TARGET_SHA" \
            "${{ matrix.context }}"
      - name: Check anonymous package access
        run: |
          python3 -I - <<'PY'
          # preflight-start
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          image = os.environ['IMAGE'].removeprefix('ghcr.io/')
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{image}:pull'})
          try:
              with urllib.request.urlopen('https://ghcr.io/token?' + query, timeout=10) as response:
                  status, body = response.status, response.read()
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read()
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit('GHCR anonymous access check failed; publishing stopped')
          try:
              data = json.loads(body)
              errors = data.get('errors') if isinstance(data, dict) else None
              denied = isinstance(errors, list) and len(errors) == 1 and isinstance(errors[0], dict) and (status, errors[0].get('code')) in {(401, 'UNAUTHORIZED'), (403, 'DENIED')}
          except (ValueError, UnicodeError):
              denied = False
          if not denied:
              raise SystemExit(f'GHCR anonymous access check returned HTTP {status}; publishing stopped')
          print('GHCR denied anonymous access; package visibility is not guaranteed')
          # preflight-end
          PY
      - name: Verify current branch HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I - <<'PYTHON'
          # branch-head-start
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = urllib.parse.quote(os.environ['GITHUB_REPOSITORY'], safe='/')
          branch = urllib.parse.quote(os.environ['TARGET_BRANCH'], safe='')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/ref/heads/{branch}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  current_sha = json.load(response)['object']['sha']
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('Branch HEAD lookup failed; publishing stopped')
          if current_sha != os.environ['TARGET_SHA']:
              raise SystemExit('Branch HEAD differs from validated SHA; publishing stopped')
          # branch-head-end
          PYTHON
      - name: Push image tags
        run: |
          docker push "$IMAGE:sha-$TARGET_SHA"
          docker push "$IMAGE:$TARGET_BRANCH"
