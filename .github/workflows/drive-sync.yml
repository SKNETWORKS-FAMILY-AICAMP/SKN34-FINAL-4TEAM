name: Artifact Drive sync
on:
  push:
    branches: [develop]
    paths:
      - docs/SKN34-final-4Team.hwpx
      - docs/SKN34-final-4Team_WBS.xlsx
      - docs/SKN34-final-4Team_요구사항정의서.xlsx
      - docs/SKN34-final-4Team_요구사항정의서.xlsx
      - docs/SKN34-final-4Team.pdf
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artifact-drive-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate approved artifacts
        run: python3 infrastructure/scripts/drive-sync.py --check
      - name: Update Drive originals
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: python3 infrastructure/scripts/drive-sync.py
